<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PKM537QM"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="center">
    <div class="card">
      <div class="brand-large">Stuff So <span class="gold">Sweet</span></div>
      <h1 id="signinHeadline">Sign in to <span class="gold">your stories</span>.</h1>
      <p class="lede" id="signinLede">Choose your sign-in method below.</p>

      <div class="signin-tabs" role="tablist">
        <button type="button" class="signin-tab is-active" id="tabMagic" role="tab" aria-selected="true" aria-controls="paneMagic">Magic link</button>
        <button type="button" class="signin-tab" id="tabPassword" role="tab" aria-selected="false" aria-controls="panePassword">Password</button>
      </div>

      <!-- Magic-link pane (default) -->
      <div class="signin-pane is-active" id="paneMagic" role="tabpanel" aria-labelledby="tabMagic">
        <form id="magicForm">
          <input type="email" id="emailMagic" class="input" placeholder="you@example.com" autocomplete="email" required>
          <button type="submit" id="magicBtn" class="btn">Send me a sign-in link</button>
          <div id="msgMagic" class="msg" style="display:none;margin-top:10px"></div>
        </form>
      </div>

      <!-- Password pane -->
      <div class="signin-pane" id="panePassword" role="tabpanel" aria-labelledby="tabPassword">
        <form id="passwordForm">
          <input type="email" id="emailPassword" class="input" placeholder="you@example.com" autocomplete="email" required>
          <input type="password" id="password" class="input" placeholder="Password" autocomplete="current-password" required minlength="6">
          <button type="submit" id="passwordBtn" class="btn">Sign in</button>
          <div class="signin-hint">Forgot? Switch back to the Magic link tab — sign in, then set a new password in Settings.</div>
          <div id="msgPassword" class="msg" style="display:none;margin-top:10px"></div>
        </form>
      </div>

      <div class="fine" style="margin-top:24px">
        By signing in you agree to our <a href="https://stuffsosweet.com/terms-of-services.html">Terms</a> and <a href="https://stuffsosweet.com/privacy-policy.html">Privacy Policy</a>.
        <br><br>
        Don't have stories yet? <a href="https://stuffsosweet.com/">Start one →</a>
      </div>
    </div>
  </main>

  <!-- Non-module tab switcher — runs immediately, no imports, no awaits.
       Wires up before the module below in case the module import stalls
       or throws (some mobile browsers have flaky IndexedDB/localStorage
       that can hang Supabase's session check). Tabs must always work. -->
  <script>
    (function () {
      function wireTabs() {
        const tabMagic    = document.getElementById("tabMagic");
        const tabPassword = document.getElementById("tabPassword");
        const paneMagic    = document.getElementById("paneMagic");
        const panePassword = document.getElementById("panePassword");
        if (!tabMagic || !tabPassword || !paneMagic || !panePassword) return;
        function activate(which) {
          const isMagic = which === "magic";
          tabMagic.classList.toggle("is-active", isMagic);
          tabPassword.classList.toggle("is-active", !isMagic);
          tabMagic.setAttribute("aria-selected", String(isMagic));
          tabPassword.setAttribute("aria-selected", String(!isMagic));
          paneMagic.classList.toggle("is-active", isMagic);
          panePassword.classList.toggle("is-active", !isMagic);
          const emailMagic    = document.getElementById("emailMagic");
          const emailPassword = document.getElementById("emailPassword");
          const passwordInput = document.getElementById("password");
          if (emailMagic && emailPassword) {
            if (isMagic && emailPassword.value && !emailMagic.value) emailMagic.value = emailPassword.value;
            if (!isMagic && emailMagic.value && !emailPassword.value) emailPassword.value = emailMagic.value;
          }
          // Auto-focus only on desktop / mouse devices. On touch, letting
          // the browser pop the keyboard from a tab tap is disorienting —
          // user can tap the field themselves.
          const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          if (!isTouch) {
            const target = isMagic ? emailMagic : (emailPassword && emailPassword.value ? passwordInput : emailPassword);
            if (target) setTimeout(function () { try { target.focus(); } catch (_) {} }, 30);
          }
        }
        tabMagic.addEventListener("click", function () { activate("magic"); });
        tabPassword.addEventListener("click", function () { activate("password"); });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", wireTabs);
      } else {
        wireTabs();
      }
    })();
  </script>

  <script type="module">
    import { redirectIfAuthenticated, requestMagicLink, signInWithPassword } from "/assets/lib.js";

    // If a session already exists, skip the sign-in form and go to stories.
    // Wrapped so a failure here (e.g. blocked storage on mobile) still
    // lets the rest of the module — form submits, prefill, contextual copy
    // — run.
    try { await redirectIfAuthenticated("/stories.html"); } catch (_) {}

    const magicForm    = document.getElementById("magicForm");
    const passwordForm = document.getElementById("passwordForm");
    const emailMagic    = document.getElementById("emailMagic");
    const emailPassword = document.getElementById("emailPassword");
    const passwordInput = document.getElementById("password");
    const magicBtn     = document.getElementById("magicBtn");
    const passwordBtn  = document.getElementById("passwordBtn");
    const msgMagic     = document.getElementById("msgMagic");
    const msgPassword  = document.getElementById("msgPassword");

    function showMsg(el, text, kind = "info") {
      el.className = "msg " + kind;
      el.textContent = text;
      el.style.display = "block";
    }

    // Pre-fill email from ?email= query (used by the marketing-site "Read your stories" CTA)
    const params = new URLSearchParams(location.search);
    const prefill = params.get("email");
    if (prefill) { emailMagic.value = prefill; emailPassword.value = prefill; }

    // Contextual headline: if user was bounced here from a chapter/story URL
    // (via requireAuth() → /?next=<url>), swap the copy so they know why they
    // landed on the sign-in form instead of the page they clicked.
    const next = params.get("next") || "";
    if (/^\/chapter\.html/.test(next) || /^\/story\.html/.test(next)) {
      document.getElementById("signinHeadline").innerHTML =
        `Sign in to <span class="gold">keep reading</span>.`;
      document.getElementById("signinLede").textContent =
        "Either method will drop you back at the chapter.";
    }

    // ─── Magic-link submit ────────────────────────────────────────────
    let magicCooldownUntil = 0;
    magicForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (Date.now() < magicCooldownUntil) return;
      magicBtn.disabled = true;
      magicBtn.textContent = "Sending…";
      msgMagic.style.display = "none";
      const { ok, error } = await requestMagicLink(emailMagic.value);
      if (ok) {
        showMsg(msgMagic, "Check your inbox — link sent to " + emailMagic.value.trim() + ". Works for 24 hours.", "success");
        magicBtn.textContent = "Sign-in link sent ✓";
        magicCooldownUntil = Date.now() + 30000;
        setTimeout(() => { magicBtn.disabled = false; magicBtn.textContent = "Send another link"; }, 30000);
      } else {
        showMsg(msgMagic, error || "Something went wrong. Try again in a moment.", "error");
        magicBtn.disabled = false; magicBtn.textContent = "Send me a sign-in link";
      }
    });

    // ─── Password submit ──────────────────────────────────────────────
    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      passwordBtn.disabled = true;
      passwordBtn.textContent = "Signing in…";
      msgPassword.style.display = "none";
      const { ok, error } = await signInWithPassword(emailPassword.value, passwordInput.value);
      if (ok) {
        const target = /^\//.test(next) ? next : "/stories.html";
        window.location.replace(target);
      } else {
        showMsg(msgPassword, error || "Invalid email or password.", "error");
        passwordBtn.disabled = false; passwordBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
