    /* Same visual family as the V1 in-app quiz — this is intentional. */
    .quiz-wrap { width: 100%; max-width: 520px; padding: 24px 18px 100px; margin: 0 auto; }

    .progress-meta { display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); margin-bottom: 10px; }
    .progress { height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b7d, #e04b57); border-radius: 6px; transition: width .3s ease; }
    .q-title { font-family: Georgia, serif; font-size: 22px; margin: 6px 0 16px; line-height: 1.3; }

      display: block; text-align: left; font-family: Arial, sans-serif; font-size: 15px; line-height: 1.4;
      padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer;
      transition: all .12s ease;
    }
    /* Only apply :hover on real mouse devices — iOS Safari + Meta/Instagram
       in-app browsers leave :hover STICKY after tap, making the last-tapped
       option look permanently highlighted. */
    @media (hover: hover) and (pointer: fine) {
      .opt:hover { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); }
    }
    .opt.selected { border-color: #e04b57; background: rgba(224,75,87,0.14); }

    .opt.multi { display: flex; align-items: center; gap: 12px; padding-left: 14px; }
    .opt.multi .check {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.35); background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      color: transparent; font-size: 14px; font-weight: 700; transition: all .1s ease;

    .opt.multi.selected .check { background: #e04b57; border-color: #e04b57; color: #fff; }

    .name-input:focus { outline: none; border-color: #e04b57; background: rgba(255,255,255,0.09); }
    .free-text {

    .continue-bar {

    .continue-btn {
      display: block; width: 100%; max-width: 520px; margin: 0 auto;

    .continue-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .working-card {

                ${g === "woman" ? "👩 Woman" : g === "man" ? "👨 Man" : "🌈 Non-binary"}
              </button>`).join("")}
          </div>
        `;
      } else if (q.type === "skip_compound") {
        const s = cur || { open_any: false, specifics: [], free_text: "" };
        const specificsLocked = !!s.open_any;
        body = `
          <div class="opt-multi-note">${q.sub || ""}</div>

          <div class="skip-section-label">Escape hatch</div>
          <div class="opt-list">
            <button class="opt ${s.open_any ? "selected" : ""}" data-skipmode="open_any">
              I'm open to anything the story chooses
            </button>
          </div>

          <div class="skip-section-label">Or tick specific things to keep OUT</div>
          <div class="opt-list" style="${specificsLocked ? "opacity:.45;pointer-events:none;" : ""}">
            ${["minors","real_people","incest","non_con","gore"].map(v => {
              const lbl = v === "minors" ? "Minors"
                       : v === "real_people" ? "Real people"
                       : v === "incest" ? "Incest"
                       : v === "non_con" ? "Non-consent"
                       : "Gore / violence";
              return `<button class="opt multi ${(s.specifics||[]).includes(v) ? "selected" : ""}" data-skipitem="${v}">
                <span class="check">&#10003;</span><span class="lbl">${lbl}</span>
              </button>`;
            }).join("")}
          </div>

          <div class="skip-section-label">Free text (anything else)</div>
          <textarea class="free-text" id="skipFree" placeholder="Optional — anything else you'd like the engine to avoid.">${escapeAttr(s.free_text || "")}</textarea>
        `;
      }

      root.innerHTML = renderProgress() + `<div class="q-title">${q.title}</div>` + body;
      wire(q);
      renderContinueBar(q);
    }

    function wire(q) {
      root.querySelectorAll(".opt").forEach(el => {
        el.addEventListener("click", () => {
          if (q.type === "single_bool" || q.type === "single") {
            state[q.key] = JSON.parse(el.dataset.v);
            render(); // re-render highlights
            // Auto-advance for single-choice questions (matches marketing quiz UX).
            setTimeout(next, 180);
          } else if (q.type === "multi") {
            const v = JSON.parse(el.dataset.v);
            const arr = Array.isArray(state[q.key]) ? state[q.key].slice() : [];
            const i = arr.indexOf(v);
            if (i >= 0) arr.splice(i, 1); else arr.push(v);
            state[q.key] = arr;
            render();
          } else if (q.type === "you_gender" && el.dataset.gender) {
            state[q.key] = el.dataset.gender;
            setTimeout(next, 180); // auto-advance like other single-select
          } else if (q.type === "skip_compound") {
            const s = state[q.key] || { open_any: false, specifics: [], free_text: "" };
            if (el.dataset.skipmode === "open_any") {
              s.open_any = !s.open_any;
              if (s.open_any) s.specifics = []; // mutex: "open to anything" clears specifics
            } else if (el.dataset.skipitem) {
              const arr = (s.specifics || []).slice();
              const i = arr.indexOf(el.dataset.skipitem);
              if (i >= 0) arr.splice(i, 1); else arr.push(el.dataset.skipitem);
              s.specifics = arr;
              if (arr.length) s.open_any = false;
            }
            s.free_text = (document.getElementById("skipFree")?.value || "").trim();
            state[q.key] = s;
            render();
          }
        });
      });
      root.querySelector("#youName")?.addEventListener("input", (e) => {
        // For the split you_name step, state is a plain string (not an object).
        state[q.key] = e.target.value.trim();
        // Toggle the INLINE Continue button (not the fixed bar).
        const inlineBtn = root.querySelector("#youNameCta");
        if (inlineBtn) inlineBtn.disabled = state[q.key].length < 1;
      });
      root.querySelector("#youNameCta")?.addEventListener("click", () => {
        // Dismiss the keyboard before transitioning so viewport doesn't jump.
        document.activeElement?.blur?.();
        next();
      });
      root.querySelector("#skipFree")?.addEventListener("input", (e) => {
        const s = state[q.key] || { open_any: false, specifics: [], free_text: "" };
        s.free_text = e.target.value;
        state[q.key] = s;
      });
    }

    function renderContinueBar(q) {
      // Single-select questions auto-advance (setTimeout in wire()), so no
      // Continue button — cleaner UX matching the marketing quiz2. Only show
      // the button for question types where the user needs to explicitly
      // commit multiple sub-choices before moving on.
      // you_name renders its own INLINE Continue right below the input (mobile
      // keyboard would cover the fixed bar). you_gender auto-advances (no button).
      const needsButton = q.type === "multi" || q.type === "skip_compound";
      if (!needsButton) { contArea.innerHTML = ""; return; }

      // If a button is already mounted for THIS render pass, only toggle its
      // enabled state — don't destroy + recreate. iOS Safari fires `input`
      // events as the user taps outside the input (autocorrect commit), and
      // if we swap the button node mid-tap the tap lands on a destroyed
      // element and does nothing. Reuse the existing DOM node.
      const existing = document.getElementById("contBtn");
      const enabled = isAnswered(q);
      const label = idx === QUESTIONS.length - 1 ? "Start my story →" : "Continue →";
      if (existing) {
        existing.disabled = !enabled;
        existing.textContent = label;
        return;
      }

      contArea.innerHTML = `
        <div class="continue-bar">
          <button class="continue-btn" id="contBtn" ${enabled ? "" : "disabled"}>${idx === QUESTIONS.length - 1 ? "Start my story →" : "Continue →"}</button>
        </div>
      `;
      document.getElementById("contBtn").addEventListener("click", (e) => {
        // iOS: if the on-screen keyboard is still up (name input focused),
        // dismiss it first so the tap position doesn't jump.
        document.activeElement?.blur?.();
        next();
      });
    }

    function isAnswered(q) {
      const v = state[q.key];
      if (q.type === "single_bool" || q.type === "single") return v !== undefined;
      if (q.type === "multi") return Array.isArray(v) && v.length > 0;
      if (q.type === "you_name") return typeof v === "string" && v.trim().length >= 1;
      if (q.type === "you_gender") return typeof v === "string" && v.length > 0;
      if (q.type === "skip_compound") return true; // fully optional
      return true;
    }

    function next() {
      const q = QUESTIONS[idx];
      if (!isAnswered(q)) return;
      idx++;
      // Skip subsequent hidden questions
      while (idx < QUESTIONS.length && QUESTIONS[idx].showIf && !QUESTIONS[idx].showIf(state)) idx++;
      if (idx >= QUESTIONS.length) submit();
      else render();
    }

    async function submit() {
      root.innerHTML = `
        <div class="working-card">
          <div class="spinner"></div>
          <div style="font-family:Georgia,serif;font-size:18px;">Building your story…</div>
          <div class="q-sub">This usually takes 60-90 seconds.</div>
        </div>
      `;
      contArea.innerHTML = "";

      const payload = {
        // No age_confirmed here — in-app users confirmed at signup; the
        // backend defaults q0_age_confirmed=true for source=app_authenticated_v2.
        in_story: state.in_story,
        you: (state.you_name || state.you_gender) ? { name: state.you_name || "", gender: state.you_gender || "" } : null,
        pairing: state.pairing,
        world: state.world,
        love_interest: state.love_interest,
        opening: state.opening,
        spicy: state.spicy,
        mood: state.mood || [],
        specifics: state.specifics || [],
        setup_depth: state.setup_depth,
        // 12 conditional drills (only populated if setup_depth === "full" + trigger)
        restraint:       state.restraint       || null,
        sensory:         state.sensory         || [],
        talk:            state.talk            || [],
        aftercare:       state.aftercare       || null,
        paranormal_kind: state.paranormal_kind || [],
        monster_flavor:  state.monster_flavor  || [],
        omegaverse:      state.omegaverse      || [],
        size:            state.size            || null,
        partner_dynamic: state.partner_dynamic || null,
        dark_kind:       state.dark_kind       || null,
        dark_consent:    state.dark_consent    || null,
        voyeur:          state.voyeur          || null,
        skip: state.skip || null,
        landing_page: window.location.href,
        user_agent: navigator.userAgent,
        device_type: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
      };

      try {
        const url = "https://gmhbcxylqubhxozomhlt.supabase.co/functions/v1/start-authenticated-story-v2";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ payload }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
        await logEvent("quiz_completed", { metadata: { source: "app", quiz_version: 2, story_id: data.story_id } });
        // Route into the story page. Chapter-1 generation is running in the
        // background; story.html handles the "generating" state.
        window.location.href = `/story.html?id=${encodeURIComponent(data.story_id)}`;
      } catch (e) {
        console.error("[quiz2] submit failed:", e);
        root.innerHTML = `
          <div class="working-card">
            <div style="font-family:Georgia,serif;font-size:18px;">Something went wrong.</div>
            <div class="error-msg">${escapeHtml(e?.message || "Please try again in a moment.")}</div>
            <button class="continue-btn" style="max-width:220px" onclick="location.reload()">Try again</button>
          </div>
        `;
      }
    }

    function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
    function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    render();
  </script>
</body>
</html>
