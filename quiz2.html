<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Start a new story — Stuff So Sweet</title>
  <link rel="icon" type="image/x-icon" href="https://stuffsosweet.com/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="https://stuffsosweet.com/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <meta name="theme-color" content="#4b0018">
  <meta name="robots" content="noindex,nofollow">

  <style>
    /* Same visual family as the V1 in-app quiz — this is intentional. */
    .quiz-wrap { width: 100%; max-width: 520px; padding: 24px 18px 100px; margin: 0 auto; }
    .quiz-back { display: inline-block; font-family: Arial, sans-serif; font-size: 13px; color: var(--faint); margin-bottom: 14px; }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); margin-bottom: 10px; }
    .progress { height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b7d, #e04b57); border-radius: 6px; transition: width .3s ease; }
    .q-title { font-family: Georgia, serif; font-size: 22px; margin: 6px 0 16px; line-height: 1.3; }
    .q-sub { font-family: Arial, sans-serif; font-size: 13px; color: var(--faint); margin-bottom: 12px; }
    .opt-list { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: block; text-align: left; font-family: Arial, sans-serif; font-size: 15px; line-height: 1.4;
      padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer;
      transition: all .12s ease;
    }
    .opt:hover { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); }
    .opt.selected { border-color: #e04b57; background: rgba(224,75,87,0.14); }
    /* Checkmark for multi-select selected state — visually distinct from single-select */
    .opt.multi { display: flex; align-items: center; gap: 12px; padding-left: 14px; }
    .opt.multi .check {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.35); background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      color: transparent; font-size: 14px; font-weight: 700; transition: all .1s ease;
    }
    .opt.multi.selected .check { background: #e04b57; border-color: #e04b57; color: #fff; }
    .opt.multi .lbl { flex: 1; }
    .opt-multi-note { font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); margin: 6px 2px 12px; }
    .skip-section-label {
      font-family: Arial, sans-serif; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--faint); margin: 18px 2px 8px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row .opt { flex: 1; }
    .name-input {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05); color: var(--text); font-family: Arial, sans-serif; font-size: 15px;
      box-sizing: border-box; margin-bottom: 10px;
    }
    .name-input:focus { outline: none; border-color: #e04b57; background: rgba(255,255,255,0.09); }
    .free-text {
      width: 100%; min-height: 80px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05); color: var(--text); font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5;
      box-sizing: border-box; margin-top: 10px; resize: vertical;
    }
    .free-text:focus { outline: none; border-color: #e04b57; background: rgba(255,255,255,0.09); }
    .continue-bar {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
      background: linear-gradient(180deg, rgba(20,0,10,0.3), rgba(20,0,10,0.85));
      backdrop-filter: blur(8px); z-index: 10;
    }
    .continue-btn {
      display: block; width: 100%; max-width: 520px; margin: 0 auto;
      padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
      font-family: Arial, sans-serif; font-size: 15px; font-weight: 600;
      background: #e04b57; color: #fff;
    }
    .continue-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .working-card {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 32px 20px; border-radius: 14px; background: rgba(255,255,255,0.05);
      text-align: center;
    }
    .error-msg { color: #ff8080; font-family: Arial, sans-serif; font-size: 14px; margin-top: 12px; text-align: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #e04b57; border-radius: 50%; animation: sp 0.8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .age-warn { font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); text-align: center; margin: 16px 4px 0; }
  </style>

</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PKM537QM" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div id="topbar"></div>
  <div class="quiz-wrap">
    <a class="quiz-back" href="/stories.html">← Back to stories</a>
    <div id="root"></div>
  </div>
  <div id="continueArea"></div>

  <script type="module">
    import { requireAuth, supabase, renderTopbar, logEvent } from "/assets/lib.js";

    const session = await requireAuth();
    renderTopbar();
    await logEvent("app_open", { metadata: { page: "quiz2" } });
    await logEvent("quiz_started", { metadata: { source: "app", quiz_version: 2 } });

    // ================================================================
    // V2 question schema — mirrors _shared/prompts_v2.ts field names.
    // ================================================================
    // In-app users are already paying subscribers who confirmed age at signup —
    // no re-prompt. The backend always sets q0_age_confirmed=true for authed source.
    const QUESTIONS = [
      { key: "in_story", type: "single", title: "Do you want to be a character in this story?", options: [
        { value: "yes", label: "✅ Yes — I want to be in it" },
        { value: "no",  label: "❌ No — I'd rather watch it unfold from the outside" },
      ] },

      // Only shown when in_story === "yes"
      { key: "you", type: "you_compound", title: "Tell the story a little about you.", showIf: (s) => s.in_story === "yes" },

      { key: "pairing", type: "single", title: "Who's the romance between?", options: [
        { value: "wm",       label: "💑 A woman and a man" },
        { value: "ww",       label: "👩‍❤️‍👩 Two women (F/F)" },
        { value: "mm",       label: "👨‍❤️‍👨 Two men (M/M)" },
        { value: "queer",    label: "🏳️‍🌈 Queer — flexible / mixed" },
        { value: "surprise", label: "🎲 Surprise me" },
      ] },

      { key: "world", type: "single", title: "What kind of world?", options: [
        { value: "contemporary",        label: "🏙 Contemporary — real world, present day" },
        { value: "historical",          label: "🕯 Historical / regency" },
        { value: "fantasy_paranormal",  label: "🔮 Fantasy or paranormal" },
        { value: "monster",             label: "🐉 Monster / non-human romance" },
        { value: "omegaverse",          label: "🐺 Omegaverse (alpha/omega dynamics)" },
        { value: "surprise",            label: "🎲 Surprise me" },
      ] },

      { key: "love_interest", type: "single", title: "What kind of love interest pulls you in?", options: [
        { value: "brooding",   label: "🌙 Brooding & mysterious" },
        { value: "protective", label: "🛡 Protective & steady" },
        { value: "playful",    label: "😏 Playful & bright" },
        { value: "ruthless",   label: "⚔ Ruthless & controlled" },
        { value: "wounded",    label: "🖤 Wounded & guarded" },
        { value: "cinnamon",   label: "🍯 Cinnamon roll — sweet, all-in" },
        { value: "wildcard",   label: "🎭 Wildcard — unpredictable" },
        { value: "surprise",   label: "🎲 Surprise me" },
      ] },

      { key: "opening", type: "single", title: "How should it start between you?", options: [
        { value: "slow_build",  label: "🕯 Slow build — first meeting, tension grows" },
        { value: "meet_cute",   label: "💛 Meet-cute — unexpected first encounter" },
        { value: "already_ten", label: "⚡ Already-tension — history when it opens" },
        { value: "one_night",   label: "🌃 One night that becomes more" },
        { value: "forced",      label: "🔒 Forced together — circumstance closes the distance" },
        { value: "fresh_start", label: "🌅 Fresh start — new place, new life" },
        { value: "surprise",    label: "🎲 Surprise me" },
      ] },

      { key: "spicy", type: "single", title: "How spicy?", options: [
        { value: "sweet",       label: "🌸 Sweet — no explicit content" },
        { value: "spicy",       label: "🌶 Spicy — explicit in key scenes" },
        { value: "very_spicy",  label: "🔥 Very Spicy — very explicit throughout" },
      ] },

      { key: "mood", type: "multi", title: "Which moods should the story lean into?", sub: "Pick as many as fit.", options: [
        { value: "soft_tender",     label: "🤗 Soft & tender" },
        { value: "slow_burn",       label: "⏳ Slow burn tension" },
        { value: "playful_bratty",  label: "😈 Playful & bratty" },
        { value: "intense",         label: "💥 Intense & consuming" },
        { value: "power_dynamic",   label: "👑 Power dynamic" },
        { value: "vulnerable",      label: "💧 Vulnerable & emotional" },
        { value: "forbidden",       label: "🚫 Forbidden / taboo" },
        { value: "dark",            label: "🖤 Dark & morally complex" },
      ] },

      { key: "setup_depth", type: "single", title: "How deep should we go on the details?", options: [
        { value: "quick", label: "⚡ Quick — you have enough. Just write it." },
        { value: "full",  label: "🎨 Full — I want to shape more of the specifics" },
      ] },

      // Only when setup_depth === "full"
      { key: "specifics", type: "multi", title: "Any specifics you want woven in?", sub: "Pick any that call to you.",
        showIf: (s) => s.setup_depth === "full",
        options: [
          { value: "dirty_talk",    label: "🗯 Dirty talk" },
          { value: "restraint",     label: "🪢 Restraint / light bondage" },
          { value: "power_play",    label: "👑 Power play / D/s" },
          { value: "voyeurism",     label: "👁 Watching / being watched" },
          { value: "size_dynamic",  label: "📏 Size difference" },
          { value: "public_risk",   label: "🎬 Public / risk of being caught" },
          { value: "praise",        label: "🌟 Praise" },
          { value: "roleplay",      label: "🎭 Roleplay" },
        ] },

      { key: "skip", type: "skip_compound", title: "Anything you want to keep OUT?",
        sub: "Optional. Anything mentioned here overrides everything above." },
    ];

    const state = {};
    let idx = 0;

    // Compute visible steps based on showIf conditionals + current state.
    function activeSteps() {
      return QUESTIONS.filter(q => !q.showIf || q.showIf(state));
    }

    function renderProgress() {
      const active = activeSteps();
      const pos = active.findIndex(q => q.key === QUESTIONS[idx]?.key);
      const pct = active.length ? Math.round(((pos + 1) / active.length) * 100) : 100;
      return `
        <div class="progress-meta"><span>Question ${pos + 1} of ${active.length}</span><span>${pct}%</span></div>
        <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      `;
    }

    const root = document.getElementById("root");
    const contArea = document.getElementById("continueArea");

    function render() {
      // Skip questions whose showIf is currently false.
      while (idx < QUESTIONS.length && QUESTIONS[idx].showIf && !QUESTIONS[idx].showIf(state)) idx++;
      if (idx >= QUESTIONS.length) return submit();

      const q = QUESTIONS[idx];
      let body = "";
      const cur = state[q.key];

      if (q.type === "single_bool" || q.type === "single") {
        body = `<div class="opt-list">` + q.options.map(o => `
          <button class="opt ${cur === o.value ? "selected" : ""}" data-v='${JSON.stringify(o.value)}'>${o.label}</button>
        `).join("") + `</div>`;
        if (q.sub) body += `<div class="age-warn">${q.sub}</div>`;
      } else if (q.type === "multi") {
        const arr = Array.isArray(cur) ? cur : [];
        body = (q.sub ? `<div class="opt-multi-note">${q.sub}</div>` : "") +
          `<div class="opt-list">` + q.options.map(o => `
            <button class="opt multi ${arr.includes(o.value) ? "selected" : ""}" data-v='${JSON.stringify(o.value)}'>
              <span class="check">&#10003;</span><span class="lbl">${o.label}</span>
            </button>
          `).join("") + `</div>`;
      } else if (q.type === "you_compound") {
        const you = cur || {};
        body = `
          <input class="name-input" id="youName" placeholder="What should we call you? (first name is fine)"
                 value="${escapeAttr(you.name || "")}">
          <div class="opt-multi-note">And how should the story refer to you?</div>
          <div class="opt-list">
            ${["woman","man","nb"].map(g => `
              <button class="opt ${you.gender === g ? "selected" : ""}" data-gender="${g}">
                ${g === "woman" ? "👩 As a woman" : g === "man" ? "👨 As a man" : "🌈 Non-binary / neither"}
              </button>`).join("")}
          </div>
        `;
      } else if (q.type === "skip_compound") {
        const s = cur || { open_any: false, specifics: [], free_text: "" };
        const specificsLocked = !!s.open_any;
        body = `
          <div class="opt-multi-note">${q.sub || ""}</div>

          <div class="skip-section-label">Escape hatch</div>
          <div class="opt-list">
            <button class="opt ${s.open_any ? "selected" : ""}" data-skipmode="open_any">
              I'm open to anything the story chooses
            </button>
          </div>

          <div class="skip-section-label">Or tick specific things to keep OUT</div>
          <div class="opt-list" style="${specificsLocked ? "opacity:.45;pointer-events:none;" : ""}">
            ${["minors","real_people","incest","non_con","gore"].map(v => {
              const lbl = v === "minors" ? "Minors"
                       : v === "real_people" ? "Real people"
                       : v === "incest" ? "Incest"
                       : v === "non_con" ? "Non-consent"
                       : "Gore / violence";
              return `<button class="opt multi ${(s.specifics||[]).includes(v) ? "selected" : ""}" data-skipitem="${v}">
                <span class="check">&#10003;</span><span class="lbl">${lbl}</span>
              </button>`;
            }).join("")}
          </div>

          <div class="skip-section-label">Free text (anything else)</div>
          <textarea class="free-text" id="skipFree" placeholder="Optional — anything else you'd like the engine to avoid.">${escapeAttr(s.free_text || "")}</textarea>
        `;
      }

      root.innerHTML = renderProgress() + `<div class="q-title">${q.title}</div>` + body;
      wire(q);
      renderContinueBar(q);
    }

    function wire(q) {
      root.querySelectorAll(".opt").forEach(el => {
        el.addEventListener("click", () => {
          if (q.type === "single_bool" || q.type === "single") {
            state[q.key] = JSON.parse(el.dataset.v);
            render(); // re-render highlights
            // Auto-advance for single-choice questions (matches marketing quiz UX).
            setTimeout(next, 180);
          } else if (q.type === "multi") {
            const v = JSON.parse(el.dataset.v);
            const arr = Array.isArray(state[q.key]) ? state[q.key].slice() : [];
            const i = arr.indexOf(v);
            if (i >= 0) arr.splice(i, 1); else arr.push(v);
            state[q.key] = arr;
            render();
          } else if (q.type === "you_compound" && el.dataset.gender) {
            const you = state[q.key] || {};
            you.gender = el.dataset.gender;
            you.name = (document.getElementById("youName")?.value || "").trim();
            state[q.key] = you;
            render();
          } else if (q.type === "skip_compound") {
            const s = state[q.key] || { open_any: false, specifics: [], free_text: "" };
            if (el.dataset.skipmode === "open_any") {
              s.open_any = !s.open_any;
              if (s.open_any) s.specifics = []; // mutex: "open to anything" clears specifics
            } else if (el.dataset.skipitem) {
              const arr = (s.specifics || []).slice();
              const i = arr.indexOf(el.dataset.skipitem);
              if (i >= 0) arr.splice(i, 1); else arr.push(el.dataset.skipitem);
              s.specifics = arr;
              if (arr.length) s.open_any = false;
            }
            s.free_text = (document.getElementById("skipFree")?.value || "").trim();
            state[q.key] = s;
            render();
          }
        });
      });
      root.querySelector("#youName")?.addEventListener("input", (e) => {
        const you = state[q.key] || {};
        you.name = e.target.value.trim();
        state[q.key] = you;
      });
      root.querySelector("#skipFree")?.addEventListener("input", (e) => {
        const s = state[q.key] || { open_any: false, specifics: [], free_text: "" };
        s.free_text = e.target.value;
        state[q.key] = s;
      });
    }

    function renderContinueBar(q) {
      // Single-select questions auto-advance (setTimeout in wire()), so no
      // Continue button — cleaner UX matching the marketing quiz2. Only show
      // the button for question types where the user needs to explicitly
      // commit multiple sub-choices before moving on.
      const needsButton = q.type === "multi" || q.type === "you_compound" || q.type === "skip_compound";
      if (!needsButton) { contArea.innerHTML = ""; return; }

      const enabled = isAnswered(q);
      contArea.innerHTML = `
        <div class="continue-bar">
          <button class="continue-btn" id="contBtn" ${enabled ? "" : "disabled"}>${idx === QUESTIONS.length - 1 ? "Start my story →" : "Continue →"}</button>
        </div>
      `;
      document.getElementById("contBtn").addEventListener("click", next);
    }

    function isAnswered(q) {
      const v = state[q.key];
      if (q.type === "single_bool" || q.type === "single") return v !== undefined;
      if (q.type === "multi") return Array.isArray(v) && v.length > 0;
      if (q.type === "you_compound") return v && v.gender && (v.name || "").length >= 1;
      if (q.type === "skip_compound") return true; // fully optional
      return true;
    }

    function next() {
      const q = QUESTIONS[idx];
      if (!isAnswered(q)) return;
      idx++;
      // Skip subsequent hidden questions
      while (idx < QUESTIONS.length && QUESTIONS[idx].showIf && !QUESTIONS[idx].showIf(state)) idx++;
      if (idx >= QUESTIONS.length) submit();
      else render();
    }

    async function submit() {
      root.innerHTML = `
        <div class="working-card">
          <div class="spinner"></div>
          <div style="font-family:Georgia,serif;font-size:18px;">Building your story…</div>
          <div class="q-sub">This usually takes 60-90 seconds.</div>
        </div>
      `;
      contArea.innerHTML = "";

      const payload = {
        // No age_confirmed here — in-app users confirmed at signup; the
        // backend defaults q0_age_confirmed=true for source=app_authenticated_v2.
        in_story: state.in_story,
        you: state.you || null,
        pairing: state.pairing,
        world: state.world,
        love_interest: state.love_interest,
        opening: state.opening,
        spicy: state.spicy,
        mood: state.mood || [],
        specifics: state.specifics || [],
        setup_depth: state.setup_depth,
        skip: state.skip || null,
        landing_page: window.location.href,
        user_agent: navigator.userAgent,
        device_type: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
      };

      try {
        const url = "https://gmhbcxylqubhxozomhlt.supabase.co/functions/v1/start-authenticated-story-v2";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ payload }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
        await logEvent("quiz_completed", { metadata: { source: "app", quiz_version: 2, story_id: data.story_id } });
        // Route into the story page. Chapter-1 generation is running in the
        // background; story.html handles the "generating" state.
        window.location.href = `/story.html?id=${encodeURIComponent(data.story_id)}`;
      } catch (e) {
        console.error("[quiz2] submit failed:", e);
        root.innerHTML = `
          <div class="working-card">
            <div style="font-family:Georgia,serif;font-size:18px;">Something went wrong.</div>
            <div class="error-msg">${escapeHtml(e?.message || "Please try again in a moment.")}</div>
            <button class="continue-btn" style="max-width:220px" onclick="location.reload()">Try again</button>
          </div>
        `;
      }
    }

    function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
    function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    render();
  </script>
</body>
</html>
