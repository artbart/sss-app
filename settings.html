  <style>
    /* ─── PAGE-SPECIFIC: settings form ─────────────────────────────── */
    .set-wrap { max-width: 640px; }
    .set-wrap h1 {
      font-family: Georgia, serif; font-size: 30px; font-weight: normal;
      color: #fff; margin: 0 0 24px;
    }
    .section {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px; padding: 22px; margin-bottom: 16px;
    }
    .section h2 {
      font-family: Georgia, serif; font-size: 18px; font-weight: normal;
      color: var(--gold); margin: 0 0 16px;
    }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block; font-family: Arial, sans-serif; font-size: 12px;
      color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em;
    }
    .field-readonly {
      padding: 12px 14px; background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
      font-family: Arial, sans-serif; font-size: 14px; color: var(--faint);
    }
    .field input.input {
      width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 10px;
      font-family: Arial, sans-serif; font-size: 14px; color: #fff;
      box-sizing: border-box;
    }
    .field input.input:focus { outline: none; border-color: var(--gold); }

    .radio-row {
      display: block; padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; transition: background 0.15s, border-color 0.15s;
    }
    .radio-row:hover { background: rgba(255,255,255,0.06); }
    .radio-row.selected {
      background: rgba(240,212,140,0.06); border-color: rgba(240,212,140,0.4);
    }
    .radio-row input[type="radio"] { display: none; }
    .radio-row .rt {
      font-family: Arial, sans-serif; font-size: 14px; font-weight: 600;
      color: #fff; margin-bottom: 3px;
    }
    .radio-row.selected .rt { color: var(--gold); }
    .radio-row .rd { font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); line-height: 1.4; }

    .check-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .check-row input { margin-top: 3px; accent-color: var(--cta); }

    .save-status {
      margin-top: 14px; font-family: Arial, sans-serif; font-size: 13px; min-height: 18px;
      transition: opacity 0.3s;
    }
    .save-status.ok  { color: #8eff6d; }
    .save-status.err { color: var(--err, #ff6b7d); }

    /* ─── Cancellation save-flow modal ─────────────────────────────── */
    /* z-index sits above the sticky header (90) and the bottom nav (100),
       or the modal would be tucked under them on mobile. */
    .save-flow-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.62);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; overflow-y: auto; z-index: 200;
    }
    .save-flow-card {
      /* --card is translucent and would vanish over the backdrop; use the
         opaque page bottom colour instead. */
      background: var(--bg-bottom); color: var(--text);
      border: 1px solid var(--card-hi); border-radius: 16px;
      padding: 24px; max-width: 380px; width: 100%;
      max-height: calc(100vh - 40px); overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .save-flow-card h3 {
      font-family: Georgia, serif; font-size: 20px; font-weight: normal;
      color: var(--gold); margin: 0 0 10px;
    }
    .save-flow-card p {
      font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5;
      color: var(--muted); margin: 0 0 18px;
    }
    .save-flow-card a { color: var(--gold); }
    .flow-reasons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
    .flow-reason { width: 100%; text-align: left; padding: 12px 14px; cursor: pointer; }
    .save-flow-card .cta-primary { display: block; width: 100%; cursor: pointer; border: 0; }
    .save-flow-card .cta-primary[disabled],
    .save-flow-card .cta-secondary[disabled] { opacity: 0.55; cursor: default; }
    .flow-dismiss {
      display: block; width: 100%; margin-top: 12px; padding: 8px;
      background: none; border: 0; text-decoration: underline; cursor: pointer;
      font-family: Arial, sans-serif; font-size: 13px; color: var(--faint);
    }
    .flow-dismiss:hover { color: var(--text); }
    .flow-dismiss[disabled] { opacity: 0.55; cursor: default; text-decoration: none; }

    .danger-zone {
      margin-top: 24px; padding: 20px; text-align: center;
      background: rgba(0,0,0,0.18); border: 1px dashed rgba(255,255,255,0.10);
      border-radius: 14px;
    }
    .danger-zone p {
      font-family: Arial, sans-serif; font-size: 13px; color: var(--faint); margin: 0 0 12px;
    }

    @media (max-width: 900px) {
      .set-wrap h1 { font-size: 24px; }
      .section { padding: 16px; }
    }
  </style>

  <script type="module">
    import { supabase, renderShell, signOut, logEvent, getSessionOrPreview, isPreviewMode, posthog, posthogReady } from "/assets/lib.js";

    const session = await getSessionOrPreview({
      users: [{
        display_name: "Arturas",
        notification_preference: "email_full_story",
        marketing_email_opt_in: true,
        subscription_status: "active",
        current_period_end: new Date(Date.now() + 20 * 24 * 3600 * 1000).toISOString(),
        cancel_at_period_end: false,
        stripe_subscription_id: "sub_preview_123",
      }],
    });
    await renderShell({ activeNav: "settings" });
    if (!isPreviewMode()) await logEvent("app_open", { metadata: { page: "settings" } });

    const $ = (id) => document.getElementById(id);
    $("emailDisplay").textContent = session.user.email;

    // Load current user profile
    const { data: user, error } = await supabase.from("users")
      .select("display_name, notification_preference, marketing_email_opt_in, subscription_status, current_period_end, cancel_at_period_end, stripe_subscription_id")
      .eq("id", session.user.id).maybeSingle();

    if (error) {
      $("saveStatus").textContent = "Couldn't load your settings: " + error.message;
      $("saveStatus").className = "save-status err";
    } else if (user) {
      $("displayName").value = user.display_name || "";
      $("marketingOptIn").checked = !!user.marketing_email_opt_in;
      const pref = user.notification_preference || "email_full_story";
      const radio = document.querySelector(`input[name="notification_preference"][value="${pref}"]`);
      if (radio) {
        radio.checked = true;
        radio.closest(".radio-row").classList.add("selected");
      }
    }

    // Highlight selected radio
    document.querySelectorAll(".radio-row").forEach(row => {
      row.addEventListener("click", () => {
        document.querySelectorAll(".radio-row").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        const input = row.querySelector("input[type=radio]");
        if (input) input.checked = true;
      });
    });

    // Save
    $("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = $("saveBtn"), status = $("saveStatus");
      saveBtn.disabled = true; saveBtn.textContent = "Saving…"; status.textContent = "";

      const newPref = document.querySelector('input[name="notification_preference"]:checked')?.value || "email_full_story";
      const updates = {
        display_name: $("displayName").value.trim() || null,
        notification_preference: newPref,
        marketing_email_opt_in: $("marketingOptIn").checked,
      };

      const { error: updateErr } = await supabase.from("users").update(updates).eq("id", session.user.id);
      if (updateErr) {
        status.textContent = "Couldn't save: " + updateErr.message;
        status.className = "save-status err";
        saveBtn.disabled = false; saveBtn.textContent = "Save changes";
        return;
      }

      if (user && user.notification_preference !== newPref) {
        await logEvent("notification_preference_changed", {
          metadata: { from: user.notification_preference, to: newPref },
        });
      }

      status.textContent = "Saved ✓"; status.className = "save-status ok";
      saveBtn.disabled = false; saveBtn.textContent = "Save changes";
      setTimeout(() => { status.textContent = ""; status.className = "save-status"; }, 3000);
    });

    // ── Subscription management ────────────────────────
    function fmtDate(iso) {
      if (!iso) return "";
      try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); }
      catch (_) { return ""; }
    }
    function renderSub(u) {
      if (!u || !u.stripe_subscription_id) { $("subSection").style.display = "none"; return; }
      $("subSection").style.display = "";
      const end = fmtDate(u.current_period_end);
      const active = u.current_period_end && new Date(u.current_period_end) >= new Date();
      if (u.cancel_at_period_end) {
        $("subStatusLine").textContent = active
          ? `Your subscription is set to end on ${end}. You keep full access until then.`
          : "Your subscription has ended.";
        $("cancelSubBtn").style.display = "none";
        $("reactivateBtn").style.display = active ? "" : "none";
      } else if (active) {
        $("subStatusLine").textContent = `Active — renews on ${end}.`;
        $("cancelSubBtn").style.display = "";
        $("reactivateBtn").style.display = "none";
      } else {
        $("subStatusLine").textContent = "No active subscription.";
        $("cancelSubBtn").style.display = "none";
        $("reactivateBtn").style.display = "none";
      }
    }

    async function manageSub(action, btn) {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = "…";
      $("subStatus").textContent = ""; $("subStatus").className = "save-status";
      const { data, error: fnErr } = await supabase.functions.invoke("cancel-subscription", { body: { action } });
      if (fnErr || !data || !data.ok) {
        $("subStatus").textContent = "Couldn't update your subscription. Please try again.";
        $("subStatus").className = "save-status err";
        btn.disabled = false; btn.textContent = original;
        return;
      }
      const { data: u2 } = await supabase.from("users")
        .select("subscription_status, current_period_end, cancel_at_period_end, stripe_subscription_id")
        .eq("id", session.user.id).maybeSingle();
      btn.disabled = false; btn.textContent = original;
      renderSub(u2);
      $("subStatus").textContent = action === "reactivate" ? "Subscription reactivated ✓" : "Cancellation scheduled ✓";
      $("subStatus").className = "save-status ok";
      await logEvent(action === "reactivate" ? "subscription_reactivated" : "subscription_cancel_requested", {});
      setTimeout(() => { $("subStatus").textContent = ""; $("subStatus").className = "save-status"; }, 4000);
    }

    // ── Cancellation save-flow ─────────────────────────
    // Reason capture, then at most two offers, branched on the reason.
    // The server (retention-offer) owns the ladder and tells us which rung to
    // show; only the display copy lives here, because _shared/retention.ts is
    // Deno-side and never served to the browser.
    //
    // Two rules govern every screen below:
    //   1. Cancelling is always one visible click away — nothing here may trap
    //      someone who wants to leave.
    //   2. Nothing cancels a subscription unless the user asked it to. Rule 1
    //      is about keeping the exit AVAILABLE; it is never a licence to take
    //      the exit on someone's behalf because our machinery broke. The one
    //      place a failure falls through to plain cancel is when the flow could
    //      not start at all (record_reason) — and there the user had just
    //      pressed "Cancel subscription", so it honours the button they pressed.
    const REASON_LABELS = {
      too_expensive: "It's too expensive",
      not_using:     "I'm not using it enough",
      ran_out:       "I ran out of stories I want to read",
      broken:        "Something isn't working",
    };

    const RUNGS = {
      discount: {
        title: "Stay for half price",
        body: "Take 50% off your next renewal. Same 3 stories a month, nothing else changes.",
        cta: "Apply 50% off",
        action: "discount",
      },
      lifetime: {
        title: "Pay once, keep it forever",
        body: "One payment of $79 and your account stays open for good — 3 stories every month, no more renewals. That's less than two renewals.",
        cta: "Get lifetime access — $79",
        action: "lifetime_checkout",
      },
      pause: {
        title: "Pause instead?",
        body: "Put your subscription on hold for 4 weeks. You won't be charged, and everything is waiting when you come back.",
        cta: "Pause for 4 weeks",
        action: "pause",
      },
      downgrade: {
        title: "Try the lighter plan",
        body: "$9.99 every 4 weeks for 1 story a month. Keeps your library and your account open.",
        cta: "Switch to $9.99",
        action: "downgrade",
      },
      support: {
        title: "Let us fix it",
        body: "Tell us what broke and we'll sort it out. Replies usually land within a day.",
        cta: "Email support",
        action: "support",
      },
    };

    const SUPPORT_MAILTO = "mailto:hello@stuffsosweet.com?subject=Something%20isn%27t%20working";

    let flowReason = null;
    let flowDeclined = [];
    // True only while the modal is on screen. Every await below re-checks it:
    // if the user dismissed the flow while a request was in flight, we must not
    // re-open a screen on top of them — and above all must not fall through to
    // cancelling a subscription they just chose to keep.
    let flowActive = false;

    const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // PostHog-only mirror, for the two events the SERVER already writes to
    // `events`: cancel_reason_selected (written by record_reason) and
    // retention_offer_accepted (written by logOffer). Those server rows are the
    // authoritative ones — the eligibility guard queries them — and a second
    // client-side row would inflate the churn-reason counts this whole feature
    // exists to produce. This is not a second analytics path: it is the same
    // posthog client lib.js exports and initialises, called with the same
    // property shape logEvent uses (metadata flattened, surface: "app"), so the
    // events look identical in PostHog whichever way they were sent.
    // Everything the server does NOT write still goes through logEvent.
    function capturePosthog(event_type, metadata) {
      if (!posthogReady) return;
      try {
        posthog.capture(event_type, { ...metadata, surface: "app" });
      } catch (e) {
        console.warn("[save-flow] posthog capture failed:", e);
      }
    }

    // One place that knows how retention-offer fails. supabase-js resolves
    // (never throws) and hands back a FunctionsHttpError whose `context` is the
    // raw Response — the status only exists there, and the body is still
    // unread at that point, so it can be parsed for the server's own wording.
    // (Verified against @supabase/functions-js 2.4.1, the version bundled by
    // supabase-js 2.45.4: invoke() throws FunctionsHttpError(response) before
    // touching the body, and catches it into { data: null, error }.)
    //
    // The failure codes do NOT mean the same thing:
    //   409 → a guard fired: already discounted/paused, an offer already
    //         accepted, or the 30-minute window lapsed. Carries a server
    //         sentence worth showing the user verbatim.
    //   502 → offer machinery is down (unset Stripe secret, or Stripe failed).
    //   500 → server error (failed write, failed eligibility lookup).
    //   404 → no subscription/account on file.
    //   400 → our own client sent something malformed. A bug, not a user state.
    //   null → network/CORS: no HTTP response at all.
    //
    // What to DO about a failure depends on which call failed, not only on the
    // code:
    //   • record_reason failed — the flow can't even start, and the user
    //     pressed "Cancel subscription". Honour the button they pressed and
    //     fall through to plain cancel; never leave them in a dead modal.
    //   • an offer action failed — the user pressed "keep me". Cancelling them
    //     because OUR machinery broke is the opposite of what they asked for,
    //     so no failure on this path ever cancels. "Never trap someone who
    //     wants to leave" means cancellation must stay AVAILABLE, not that we
    //     cancel on their behalf. See showOfferUnavailable().
    // 502/500/404/400 error strings are deliberately generic server-side (they
    // must not leak coupon or price ids), so only 409's message is surfaced.
    async function invokeRetention(body) {
      const { data, error } = await supabase.functions.invoke("retention-offer", { body });
      if (!error) {
        if (data && data.ok) return { ok: true, data };
        console.error("[save-flow] retention-offer returned 2xx without ok:true:", data);
        return { ok: false, status: null, conflict: false, message: null };
      }
      const status = typeof error?.context?.status === "number" ? error.context.status : null;
      let message = null;
      if (error?.context && typeof error.context.json === "function") {
        try {
          const parsed = await error.context.json();
          if (parsed && typeof parsed.error === "string") message = parsed.error;
        } catch (_) { /* non-JSON error body (gateway page, empty body) */ }
      }
      if (status === 400) {
        console.error("[save-flow] retention-offer rejected our request as malformed (400).",
          "This is a client bug. Body was:", body, "Server said:", message);
      } else if (status === null) {
        console.warn("[save-flow] retention-offer failed with no HTTP status (network/CORS):", error);
      } else if (status !== 409) {
        console.warn(`[save-flow] retention-offer failed (${status}):`, message || error.message);
      }
      return { ok: false, status, conflict: status === 409, message };
    }

    function onFlowKeydown(e) {
      // Escape only ever closes the flow — it never cancels anything.
      if (e.key === "Escape") closeFlow();
    }

    function closeFlow() {
      flowActive = false;
      const el = $("saveFlow");
      if (el) el.remove();
      document.removeEventListener("keydown", onFlowKeydown);
      const opener = $("cancelSubBtn");
      if (opener && opener.style.display !== "none") opener.focus();
    }

    function renderFlow(inner) {
      const existing = $("saveFlow");
      if (existing) existing.remove();
      const wrap = document.createElement("div");
      wrap.id = "saveFlow";
      wrap.className = "save-flow-backdrop";
      flowActive = true;
      wrap.innerHTML = `<div class="save-flow-card" role="dialog" aria-modal="true" aria-labelledby="flowTitle">${inner}</div>`;
      document.body.appendChild(wrap);
      document.addEventListener("keydown", onFlowKeydown);
      // Focus the safe control, never a destructive one: screens whose first
      // button cancels the subscription opt the "keep" link in instead, so a
      // stray Enter can't end someone's subscription.
      (wrap.querySelector("[data-autofocus]") || wrap.querySelector("button"))?.focus();
      return wrap;
    }

    // Every screen carries this: an explicit, unhidden way to leave.
    function keepLink(autofocus) {
      return `<button type="button" class="flow-dismiss" id="flowClose"${autofocus ? " data-autofocus" : ""}>Never mind, keep my subscription</button>`;
    }
    function bindKeep() {
      $("flowClose").addEventListener("click", closeFlow);
    }

    function openReasonStep() {
      flowReason = null;
      flowDeclined = [];
      const opts = Object.entries(REASON_LABELS)
        .map(([k, label]) => `<button type="button" class="cta-secondary flow-reason" data-reason="${k}">${escHtml(label)}</button>`)
        .join("");
      const wrap = renderFlow(`
        <h3 id="flowTitle">Before you go</h3>
        <p>What's the main reason you're cancelling?</p>
        <div class="flow-reasons">${opts}</div>
        ${keepLink()}
      `);
      wrap.querySelectorAll(".flow-reason").forEach((b) => {
        b.addEventListener("click", () => chooseReason(b));
      });
      bindKeep();
    }

    async function chooseReason(btn) {
      const reason = btn.dataset.reason;
      flowReason = reason;
      flowDeclined = [];
      const label = btn.textContent;
      document.querySelectorAll(".flow-reason").forEach((b) => { b.disabled = true; });
      btn.textContent = "…";
      // PostHog only: record_reason writes the authoritative `events` row
      // itself (and that row is what arms the 30-minute offer window), so a
      // client-side insert here would double-count every churn reason.
      capturePosthog("cancel_reason_selected", { reason });
      const res = await invokeRetention({ action: "record_reason", reason, declined: flowDeclined });
      if (!flowActive) return;
      // record_reason cannot 409. Any failure here means we cannot make an
      // offer at all, and the user already asked to cancel — don't trap them.
      if (!res.ok) return finishCancel();
      btn.textContent = label;
      showRung(res.data.rung);
    }

    function showRung(rung) {
      // "cancel" is the server saying the ladder is exhausted. Reaching here
      // always follows an explicit "cancel my subscription" click.
      if (rung === "cancel" || !RUNGS[rung]) return finishCancel();
      const r = RUNGS[rung];
      renderFlow(`
        <h3 id="flowTitle">${escHtml(r.title)}</h3>
        <p>${escHtml(r.body)}</p>
        <button type="button" class="cta-primary" id="flowAccept">${escHtml(r.cta)}</button>
        <button type="button" class="flow-dismiss" id="flowDecline">No thanks, cancel my subscription</button>
        ${keepLink()}
      `);
      $("flowAccept").addEventListener("click", () => acceptRung(rung));
      $("flowDecline").addEventListener("click", () => declineRung(rung));
      bindKeep();
      logEvent("retention_offer_shown", { metadata: { reason: flowReason, rung } });
    }

    async function acceptRung(rung) {
      const r = RUNGS[rung];

      if (rung === "support") {
        // Full logEvent here, unlike the rungs below: support never calls
        // retention-offer, so the server writes no row for it. Skipping the
        // insert would make support acceptances invisible in `events`.
        await logEvent("retention_offer_accepted", { metadata: { reason: flowReason, rung } });
        if (!flowActive) return;
        window.location.href = SUPPORT_MAILTO;
        renderFlow(`
          <h3 id="flowTitle">Your email is open</h3>
          <p>Tell us what went wrong and send it over — we'll pick it up. If nothing opened, write to hello@stuffsosweet.com.</p>
          <button type="button" class="flow-dismiss" id="flowCancelAnyway">Cancel my subscription anyway</button>
          ${keepLink(true)}
        `);
        $("flowCancelAnyway").addEventListener("click", () => declineRung(rung));
        bindKeep();
        return;
      }

      const btn = $("flowAccept");
      btn.disabled = true; btn.textContent = "…";
      const res = await invokeRetention({ action: r.action, reason: flowReason, declined: flowDeclined });

      // NO failure here cancels anything. This user clicked an offer, i.e.
      // "I want to stay" — a guard firing (409) or our own machinery being
      // broken (502 from an unset Stripe secret, which is the expected state
      // until the coupon and Lite price exist) are both our problem, not a
      // request to cancel. Say it didn't work, keep the choice theirs.
      if (!res.ok) {
        if (!flowActive) return;
        return showOfferUnavailable(rung, res);
      }

      // Lifetime is not an acceptance yet — nobody has paid. The function
      // records `lifetime_checkout_started`; the webhook records the purchase.
      // Writing retention_offer_accepted here would also arm the server's
      // anti-stacking guard, which deliberately exempts lifetime_checkout so
      // that abandoning Stripe's page and coming back still works.
      if (res.data.checkout_url) {
        // Dismissed while Stripe was creating the session: leave them where
        // they are rather than yanking them to a checkout page. The unused
        // session costs nothing and expires on its own.
        if (flowActive) window.location.href = res.data.checkout_url;
        return;
      }

      // PostHog only: the function's logOffer() already wrote the
      // retention_offer_accepted row server-side, and that row is what the
      // anti-stacking guard reads.
      capturePosthog("retention_offer_accepted", { reason: flowReason, rung });
      closeFlow();
      $("subStatus").textContent = res.data.message || "Done ✓";
      $("subStatus").className = "save-status ok";
      await refreshSub();
    }

    async function declineRung(rung) {
      const btn = $("flowDecline") || $("flowCancelAnyway");
      if (btn) { btn.disabled = true; btn.textContent = "…"; }
      await logEvent("retention_offer_declined", { metadata: { reason: flowReason, rung } });
      if (!flowDeclined.includes(rung)) flowDeclined.push(rung);
      const res = await invokeRetention({ action: "record_reason", reason: flowReason, declined: flowDeclined });
      if (!flowActive) return;
      // The user just clicked "cancel my subscription", so cancelling on a
      // failed lookup matches what they asked for.
      if (!res.ok) return finishCancel();
      showRung(res.data.rung);
    }

    // Every accept-path failure lands here. The offer is off the table but the
    // user is not — they asked to stay, so nothing cancels without another
    // explicit click. Only the wording varies: a 409 means "that offer is no
    // longer available" and the server phrased it, everything else means
    // "something broke on our end" and the server's copy is too generic to show.
    function showOfferUnavailable(rung, res) {
      const title = res.conflict ? "That offer isn't available" : "That didn't go through";
      const body = res.conflict
        ? (res.message || "That offer isn't available on your account.")
        : "Something went wrong on our end, so we couldn't apply that. Your subscription hasn't changed.";
      renderFlow(`
        <h3 id="flowTitle">${escHtml(title)}</h3>
        <p>${escHtml(body)}</p>
        <button type="button" class="cta-primary" id="flowOther">Show me another option</button>
        <button type="button" class="flow-dismiss" id="flowCancelAnyway">Cancel my subscription</button>
        ${keepLink()}
      `);
      $("flowOther").addEventListener("click", () => tryAnotherRung(rung));
      $("flowCancelAnyway").addEventListener("click", finishCancel);
      bindKeep();
    }

    // Deliberately not declineRung(): the user did not decline this offer, it
    // failed on us. So this logs no decline, and — critically — an exhausted
    // ladder ends on a screen, not on a cancellation.
    // Re-running record_reason also re-arms the server's 30-minute window,
    // which is what makes the stale-window flavour of 409 self-heal on the
    // next rung.
    async function tryAnotherRung(rung) {
      const btn = $("flowOther");
      btn.disabled = true; btn.textContent = "…";
      if (!flowDeclined.includes(rung)) flowDeclined.push(rung);
      const res = await invokeRetention({ action: "record_reason", reason: flowReason, declined: flowDeclined });
      if (!flowActive) return;
      if (!res.ok || res.data.rung === "cancel" || !RUNGS[res.data.rung]) return showNoAlternatives();
      showRung(res.data.rung);
    }

    // The terminal screen for a failed offer — reached when the ladder has
    // nothing left, including the case where the FINAL rung of a branch failed.
    // It has to leave the user with somewhere to go, so it says plainly that
    // nothing changed and offers a human: stay, write to us, or cancel.
    function showNoAlternatives() {
      renderFlow(`
        <h3 id="flowTitle">Nothing else we can offer</h3>
        <p>We don't have another option for your account right now. Your subscription is unchanged — still active, and it stays that way unless you cancel below. If it was that offer you wanted, email <a href="mailto:hello@stuffsosweet.com">hello@stuffsosweet.com</a> and we'll sort it out by hand.</p>
        <button type="button" class="flow-dismiss" id="flowCancelAnyway">Cancel my subscription</button>
        ${keepLink(true)}
      `);
      $("flowCancelAnyway").addEventListener("click", finishCancel);
      bindKeep();
    }

    async function refreshSub() {
      const { data: u2 } = await supabase.from("users")
        .select("subscription_status, current_period_end, cancel_at_period_end, stripe_subscription_id")
        .eq("id", session.user.id).maybeSingle();
      renderSub(u2);
    }

    // Plain cancellation is untouched: it stays in cancel-subscription, via
    // the same manageSub() path that worked before this flow existed.
    function finishCancel() {
      closeFlow();
      manageSub("cancel", $("cancelSubBtn"));
    }

    $("cancelSubBtn").addEventListener("click", openReasonStep);
    $("reactivateBtn").addEventListener("click", (e) => manageSub("reactivate", e.currentTarget));

    renderSub(user);
    $("signOutBtn2").addEventListener("click", () => signOut("/"));
  </script>
</body>
</html>
