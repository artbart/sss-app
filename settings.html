<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Settings — Stuff So Sweet</title>
  <link rel="icon" type="image/x-icon" href="https://stuffsosweet.com/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="https://stuffsosweet.com/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/app-shell.css">
  <meta name="theme-color" content="#4b0018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex,nofollow">

  <style>
    /* ─── PAGE-SPECIFIC: settings form ─────────────────────────────── */
    .set-wrap { max-width: 640px; }
    .set-wrap h1 {
      font-family: Georgia, serif; font-size: 30px; font-weight: normal;
      color: #fff; margin: 0 0 24px;
    }
    .section {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px; padding: 22px; margin-bottom: 16px;
    }
    .section h2 {
      font-family: Georgia, serif; font-size: 18px; font-weight: normal;
      color: var(--gold); margin: 0 0 16px;
    }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block; font-family: Arial, sans-serif; font-size: 12px;
      color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em;
    }
    .field-readonly {
      padding: 12px 14px; background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
      font-family: Arial, sans-serif; font-size: 14px; color: var(--faint);
    }
    .field input.input {
      width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 10px;
      font-family: Arial, sans-serif; font-size: 14px; color: #fff;
      box-sizing: border-box;
    }
    .field input.input:focus { outline: none; border-color: var(--gold); }

    .radio-row {
      display: block; padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; transition: background 0.15s, border-color 0.15s;
    }
    .radio-row:hover { background: rgba(255,255,255,0.06); }
    .radio-row.selected {
      background: rgba(240,212,140,0.06); border-color: rgba(240,212,140,0.4);
    }
    .radio-row input[type="radio"] { display: none; }
    .radio-row .rt {
      font-family: Arial, sans-serif; font-size: 14px; font-weight: 600;
      color: #fff; margin-bottom: 3px;
    }
    .radio-row.selected .rt { color: var(--gold); }
    .radio-row .rd { font-family: Arial, sans-serif; font-size: 12px; color: var(--faint); line-height: 1.4; }

    .check-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .check-row input { margin-top: 3px; accent-color: var(--cta); }

    .save-status {
      margin-top: 14px; font-family: Arial, sans-serif; font-size: 13px; min-height: 18px;
      transition: opacity 0.3s;
    }
    .save-status.ok  { color: #8eff6d; }
    .save-status.err { color: var(--err, #ff6b7d); }

    .danger-zone {
      margin-top: 24px; padding: 20px; text-align: center;
      background: rgba(0,0,0,0.18); border: 1px dashed rgba(255,255,255,0.10);
      border-radius: 14px;
    }
    .danger-zone p {
      font-family: Arial, sans-serif; font-size: 13px; color: var(--faint); margin: 0 0 12px;
    }

    @media (max-width: 900px) {
      .set-wrap h1 { font-size: 24px; }
      .section { padding: 16px; }
    }
  </style>

</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PKM537QM"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header class="m-header" id="shell-mheader">
    <a href="/stories.html" class="m-brand">Stuff So <span>Sweet</span></a>
  </header>
  <div class="dash">
    <aside class="rail" id="shell-rail">
      <a href="/stories.html" class="rail-brand">Stuff So <span>Sweet</span></a>
      <nav class="rail-nav">
        <a href="/stories.html" data-nav="home" class=""><span class="n-ico">🏠</span> Home</a>
        <a href="/quiz2.html" data-nav="new" class=""><span class="n-ico">✎</span> New story</a>
        <a href="#chat" data-nav="chat" class=""><span class="n-ico">💬</span> Chat</a>
        <a href="/library/" data-nav="library" class=""><span class="n-ico">📚</span> Library</a>
        <a href="/settings.html" data-nav="settings" class="active"><span class="n-ico">⚙️</span> Settings</a>
      </nav>
      <a class="rail-user" href="/settings.html" title="Account settings">
        <div class="u-av" id="railAv">…</div>
        <div class="u-name" id="railName">…</div>
      </a>
    </aside>
    <main class="main">

      <div class="set-wrap">
        <a class="back-link" href="/stories.html">← Back to home</a>
        <h1>Settings</h1>

        <form id="settingsForm">
          <div class="section">
            <h2>Your account</h2>
            <div class="field">
              <label class="field-label">Email</label>
              <div class="field-readonly" id="emailDisplay">…</div>
            </div>
            <div class="field">
              <label class="field-label" for="displayName">Display name <span style="color:rgba(255,255,255,0.3)">(optional)</span></label>
              <input class="input" type="text" id="displayName" placeholder="What should we call you?" maxlength="60">
            </div>
          </div>

          <div class="section">
            <h2>Chapter notifications</h2>
            <p class="field-label" style="margin-bottom: 12px;">How should we deliver your chapters?</p>

            <label class="radio-row" data-pref="email_full_story">
              <input type="radio" name="notification_preference" value="email_full_story">
              <div class="rt">Send the full chapter in my inbox</div>
              <div class="rd">Read every chapter right in your email, with option buttons to pick what happens next. (Default.)</div>
            </label>

            <label class="radio-row" data-pref="email_link_only">
              <input type="radio" name="notification_preference" value="email_link_only">
              <div class="rt">Just notify me — I'll read in the app</div>
              <div class="rd">A short email when your next chapter is ready, with a button to open it here.</div>
            </label>

            <label class="radio-row" data-pref="in_app_only">
              <input type="radio" name="notification_preference" value="in_app_only">
              <div class="rt">No emails — I'll check the app</div>
              <div class="rd">We won't send anything to your inbox. New chapters appear here when ready.</div>
            </label>

            <div class="field" style="margin-top: 16px;">
              <label class="check-row">
                <input type="checkbox" id="marketingOptIn">
                <div>
                  <div style="font-family:Arial,sans-serif;font-size:14px;color:#fff;">Send me occasional updates</div>
                  <div style="font-family:Arial,sans-serif;font-size:12px;color:var(--faint);margin-top:2px;">New features, story drops, special offers. Separate from chapter delivery.</div>
                </div>
              </label>
            </div>
          </div>

          <button type="submit" class="cta-primary" id="saveBtn">Save changes</button>
          <div class="save-status" id="saveStatus"></div>
        </form>

        <div class="section" id="subSection" style="display:none;margin-top:24px;">
          <h2>Subscription</h2>
          <div class="field-readonly" id="subStatusLine" style="margin-bottom:14px;">…</div>
          <button type="button" class="cta-secondary" id="cancelSubBtn" style="display:none;">Cancel subscription</button>
          <button type="button" class="cta-primary"   id="reactivateBtn" style="display:none;">Reactivate subscription</button>
          <div class="save-status" id="subStatus"></div>
        </div>

        <div class="danger-zone">
          <p>Signing out only removes this device. Your stories stay safe.</p>
          <button type="button" class="cta-secondary" id="signOutBtn2">Sign out</button>
        </div>
      </div>

    </main>
  </div>
  <nav class="bottom-nav" id="shell-bnav">
    <a href="/stories.html" data-nav="home" class="bn-item "><span class="bn-ico">🏠</span>Home</a>
    <a href="/library/" data-nav="library" class="bn-item "><span class="bn-ico">📚</span>Library</a>
    <a href="#chat" data-nav="chat" class="bn-item "><span class="bn-ico">💬</span>Chat</a>
    <a href="/settings.html" data-nav="settings" class="bn-item active"><span class="bn-ico">👤</span>You</a>
  </nav>

  <script type="module">
    import { supabase, renderShell, signOut, logEvent, getSessionOrPreview, isPreviewMode } from "/assets/lib.js";

    const session = await getSessionOrPreview({
      users: [{
        display_name: "Arturas",
        notification_preference: "email_full_story",
        marketing_email_opt_in: true,
        subscription_status: "active",
        current_period_end: new Date(Date.now() + 20 * 24 * 3600 * 1000).toISOString(),
        cancel_at_period_end: false,
        stripe_subscription_id: "sub_preview_123",
      }],
    });
    await renderShell({ activeNav: "settings" });
    if (!isPreviewMode()) await logEvent("app_open", { metadata: { page: "settings" } });

    const $ = (id) => document.getElementById(id);
    $("emailDisplay").textContent = session.user.email;

    // Load current user profile
    const { data: user, error } = await supabase.from("users")
      .select("display_name, notification_preference, marketing_email_opt_in, subscription_status, current_period_end, cancel_at_period_end, stripe_subscription_id")
      .eq("id", session.user.id).maybeSingle();

    if (error) {
      $("saveStatus").textContent = "Couldn't load your settings: " + error.message;
      $("saveStatus").className = "save-status err";
    } else if (user) {
      $("displayName").value = user.display_name || "";
      $("marketingOptIn").checked = !!user.marketing_email_opt_in;
      const pref = user.notification_preference || "email_full_story";
      const radio = document.querySelector(`input[name="notification_preference"][value="${pref}"]`);
      if (radio) {
        radio.checked = true;
        radio.closest(".radio-row").classList.add("selected");
      }
    }

    // Highlight selected radio
    document.querySelectorAll(".radio-row").forEach(row => {
      row.addEventListener("click", () => {
        document.querySelectorAll(".radio-row").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        const input = row.querySelector("input[type=radio]");
        if (input) input.checked = true;
      });
    });

    // Save
    $("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = $("saveBtn"), status = $("saveStatus");
      saveBtn.disabled = true; saveBtn.textContent = "Saving…"; status.textContent = "";

      const newPref = document.querySelector('input[name="notification_preference"]:checked')?.value || "email_full_story";
      const updates = {
        display_name: $("displayName").value.trim() || null,
        notification_preference: newPref,
        marketing_email_opt_in: $("marketingOptIn").checked,
      };

      const { error: updateErr } = await supabase.from("users").update(updates).eq("id", session.user.id);
      if (updateErr) {
        status.textContent = "Couldn't save: " + updateErr.message;
        status.className = "save-status err";
        saveBtn.disabled = false; saveBtn.textContent = "Save changes";
        return;
      }

      if (user && user.notification_preference !== newPref) {
        await logEvent("notification_preference_changed", {
          metadata: { from: user.notification_preference, to: newPref },
        });
      }

      status.textContent = "Saved ✓"; status.className = "save-status ok";
      saveBtn.disabled = false; saveBtn.textContent = "Save changes";
      setTimeout(() => { status.textContent = ""; status.className = "save-status"; }, 3000);
    });

    // ── Subscription management ────────────────────────
    function fmtDate(iso) {
      if (!iso) return "";
      try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); }
      catch (_) { return ""; }
    }
    function renderSub(u) {
      if (!u || !u.stripe_subscription_id) { $("subSection").style.display = "none"; return; }
      $("subSection").style.display = "";
      const end = fmtDate(u.current_period_end);
      const active = u.current_period_end && new Date(u.current_period_end) >= new Date();
      if (u.cancel_at_period_end) {
        $("subStatusLine").textContent = active
          ? `Your subscription is set to end on ${end}. You keep full access until then.`
          : "Your subscription has ended.";
        $("cancelSubBtn").style.display = "none";
        $("reactivateBtn").style.display = active ? "" : "none";
      } else if (active) {
        $("subStatusLine").textContent = `Active — renews on ${end}.`;
        $("cancelSubBtn").style.display = "";
        $("reactivateBtn").style.display = "none";
      } else {
        $("subStatusLine").textContent = "No active subscription.";
        $("cancelSubBtn").style.display = "none";
        $("reactivateBtn").style.display = "none";
      }
    }

    async function manageSub(action, btn) {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = "…";
      $("subStatus").textContent = ""; $("subStatus").className = "save-status";
      const { data, error: fnErr } = await supabase.functions.invoke("cancel-subscription", { body: { action } });
      if (fnErr || !data || !data.ok) {
        $("subStatus").textContent = "Couldn't update your subscription. Please try again.";
        $("subStatus").className = "save-status err";
        btn.disabled = false; btn.textContent = original;
        return;
      }
      const { data: u2 } = await supabase.from("users")
        .select("subscription_status, current_period_end, cancel_at_period_end, stripe_subscription_id")
        .eq("id", session.user.id).maybeSingle();
      btn.disabled = false; btn.textContent = original;
      renderSub(u2);
      $("subStatus").textContent = action === "reactivate" ? "Subscription reactivated ✓" : "Cancellation scheduled ✓";
      $("subStatus").className = "save-status ok";
      await logEvent(action === "reactivate" ? "subscription_reactivated" : "subscription_cancel_requested", {});
      setTimeout(() => { $("subStatus").textContent = ""; $("subStatus").className = "save-status"; }, 4000);
    }

    $("cancelSubBtn").addEventListener("click", (e) => {
      if (!confirm("Cancel your subscription? You'll keep full access until the end of your current paid period.")) return;
      manageSub("cancel", e.currentTarget);
    });
    $("reactivateBtn").addEventListener("click", (e) => manageSub("reactivate", e.currentTarget));

    renderSub(user);
    $("signOutBtn2").addEventListener("click", () => signOut("/"));
  </script>
</body>
</html>
