    /* ─── PAGE-SPECIFIC: books grid landing ───────────────────────── */
    .lib-head { margin-bottom: 24px; }
    .lib-head h1 {
      font-family: Georgia, serif; font-size: 30px; font-weight: normal;
      color: #fff; margin: 0 0 4px; letter-spacing: -0.01em;
    }
    .lib-head .sub { font-family: Arial, sans-serif; font-size: 13px; color: var(--faint); margin: 0; }

    .book-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    .book-card {
      display: grid; grid-template-columns: 120px 1fr; gap: 20px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px; padding: 18px; text-decoration: none; color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .book-card:hover {
      background: rgba(255,255,255,0.07); border-color: rgba(240,212,140,0.28);
      transform: translateY(-1px);
    }
    /* .book-cover-wrap is a 3:4 slot that hosts the AI image AND the gold
       title overlay in the bottom-third. Replaces the plain <img> so we can
       layer text on top. */
    .book-cover-wrap {
      position: relative; width: 120px; aspect-ratio: 3 / 4; flex-shrink: 0;
      border-radius: 10px; overflow: hidden;
      background-size: cover; background-position: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .book-cover-wrap::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }
    .book-cover-wrap .cover-title-overlay {
      position: absolute; bottom: 6%; left: 6%; right: 6%; z-index: 2;
      text-align: center;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 500;
      color: #d4a24b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      line-height: 1.05;
      font-size: 10px;
      pointer-events: none;
    }
    .book-cover-wrap .cover-title-overlay span { display: block; }
    .book-info { display: flex; flex-direction: column; min-width: 0; }
    .book-title {
      font-family: Georgia, serif; font-size: 22px; color: var(--gold);
      margin: 0 0 4px; line-height: 1.15; letter-spacing: -0.01em; font-weight: normal;
    }
    .book-author {
      font-family: Arial, sans-serif; font-size: 10px; color: var(--faint);
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px;
    }
    .book-tagline {
      font-family: Georgia, serif; font-style: italic; font-size: 14px; line-height: 1.5;
      color: var(--muted); margin: 0 0 12px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-meta {
      display: flex; flex-wrap: wrap; gap: 8px; row-gap: 4px;
      font-family: Arial, sans-serif; font-size: 12px; color: var(--faint);
      margin-top: auto;
    }
    .book-meta .heat {
      color: var(--gold); font-weight: 600; letter-spacing: 0.04em;
    }

    @media (max-width: 900px) {
      .lib-head h1 { font-size: 24px; }
      .book-card { grid-template-columns: 90px 1fr; gap: 14px; padding: 14px; }
      .book-cover-wrap { width: 90px; }
      .book-cover-wrap .cover-title-overlay { font-size: 8px; letter-spacing: 0.08em; }
      .book-title { font-size: 18px; }
      .book-tagline { -webkit-line-clamp: 2; font-size: 13px; }
    }
  </style>

    document.getElementById("lib-sub").textContent =

                         : `${BOOKS.length} books · included with your subscription`;

    function splitTitleForOverlay(title){
      const t = String(title || "").trim();
      if (t.length <= 14) return [t];
      if (t.includes(",")) {
        const parts = t.split(",").map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2) return parts.slice(0, 3);
      }
      const words = t.split(/\s+/);
      if (words.length <= 2) return [t];
      const mid = Math.ceil(words.length / 2);
      return [words.slice(0, mid).join(" "), words.slice(mid).join(" ")];
    }
    function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

    document.getElementById("grid").innerHTML = BOOKS.map(b => {
      const overlay = splitTitleForOverlay(b.title).map(p => `<span>${esc(p)}</span>`).join("");
      const href = b.href || `/library/book/${b.id}/`;
      return `
      <a class="book-card" href="${href}">
        <div class="book-cover-wrap" style="background-image: url('${b.cover}');">
          <div class="cover-title-overlay">${overlay}</div>
        </div>
        <div class="book-info">
          <div class="book-title">${b.title}</div>
          <div class="book-author">${b.author}</div>
          <p class="book-tagline">${b.tagline}</p>

            <span>${b.chapters} chapters</span>
            <span>· ~${(b.words/1000).toFixed(0)}k words</span>
            <span>· ~${b.readMins} min read</span>
            <span>· <span class="heat">${b.heat}</span></span>
