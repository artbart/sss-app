  <style>
    /* ─── PAGE-SPECIFIC: reader canvas ─────────────────────────────── */
    /* Reader lives inside main but is width-capped for readability */
    .reader { max-width: 640px; margin: 0 auto; }

    .story-title {
      font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.35);
      text-align: center; margin-bottom: 4px;
    }
    .chapter-label {
      font-family: Arial, sans-serif; font-size: 13px; color: var(--faint);
      text-align: center; margin-bottom: 24px;
    }
    /* Prose sits directly on the page — no card background — so the reader
       doesn't look like a "second tower" next to the rail. Same visual
       treatment as the home hero, where content flows on the body. */
    .chapter-card {
      background: transparent; border: none;
      padding: 0; margin-bottom: 22px;
    }
    .chapter-card h1 {
      font-family: Georgia, serif; font-size: clamp(24px, 5vw, 30px);
      color: var(--gold); font-weight: normal; letter-spacing: -0.01em;
      margin: 0 0 18px; text-align: left; line-height: 1.15;
    }
    .prose p {
      font-family: Georgia, serif;
      font-size: 17px; line-height: 1.7; margin: 0 0 16px;
      color: #f4ece1;
    }
    .prose p:last-child { margin-bottom: 0; }

    /* Choose-next controls */
    .choose-label {
      font-family: Arial, sans-serif; font-size: 15px; font-weight: 600;
      margin: 8px 0 14px;
      /* --text is only defined in reading-mode.css light palettes, so
         dark mode falls back to the hardcoded white. Keeps the choose
         prompt readable in Sepia/Pocket/Paper without an extra ruleset. */
      color: var(--text, #fff);
    }
    /* Legacy .option-btn — kept for tooling that still references it. New
       flow uses .option-card + .option-text + .opt-primary/.opt-secondary. */
    .option-btn {
      display: block; width: 100%; text-align: left; padding: 16px 18px;
      margin-bottom: 10px; border: none; border-radius: 14px; cursor: pointer;
      background: var(--cta); color: #fff;
      font-family: Georgia, serif; font-size: 15px; line-height: 1.4;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 6px 16px rgba(224,75,87,0.25);
    }
    .option-btn:hover { background: var(--cta-hover); }
    .option-btn:active { transform: translateY(1px); }
    .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .option-btn strong { font-weight: 700; }

    /* ─── Option cards (spec: expandable-option-blocks v4) ──────────
       Two-tone surfaces (page bg vs card surface). Red is state, not
       decoration — appears only on: open card's 3px left rail, mono
       index number, checked checkbox, primary CTA. Exactly ONE card is
       open at a time. Prose leads (serif 16/1.6), quiet mono index.
       Theme-aware via reading-mode.css --* variables, with dark defaults.
       Tokens picked to survive Sepia/Paper/Pocket palettes too. */
    .option-card {
      position: relative;
      margin-bottom: 14px;
      background: var(--card, #2b1d22);
      border: 1px solid var(--rm-border, rgba(209,86,106,0.38));
      border-radius: 14px;
      padding: 20px 22px 22px 30px;  /* extra left for rail + index */
      box-shadow: 3px 3px 0 rgba(209,86,106,0.20);
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .option-card::before {
      /* 3px left rail: neutral by default, accent when open */
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: rgba(255,255,255,0.09);
      border-radius: 14px 0 0 14px;
    }
    .option-card.open::before { background: var(--cta, #d1566a); }
    .option-card.open {
      border-color: rgba(209,86,106,0.55);
      box-shadow: 3px 3px 0 rgba(209,86,106,0.30);
    }

    /* Header row: mono index number hangs to the left of prose */
    .opt-header { display: flex; gap: 12px; align-items: baseline; }
    .opt-index {
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; letter-spacing: 0.08em; font-weight: 600;
      color: var(--cta, #d1566a);
      flex: 0 0 auto;
      min-width: 20px;
    }
    .opt-text {
      flex: 1;
      font-family: Georgia, 'Source Serif 4', serif;
      font-size: 16px; line-height: 1.6;
      color: var(--text, #f3ebec);
      margin: 0;
      text-wrap: pretty;
    }
    .opt-text strong { font-weight: 600; }  /* no attention-grab lead-in */

    /* Additions block — only shown when card is .open. Structure: label +
       ≥44px checkbox rows + full-width primary CTA + count line. */
    .opt-additions { display: none; margin-top: 16px; }
    .option-card.open .opt-additions { display: block; }

    .opt-mods-label {
      font-family: Arial, sans-serif;
      font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
      color: var(--faint, #8b7679);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .opt-mod {
      display: flex; align-items: center; gap: 12px;
      min-height: 44px; padding: 8px 6px;
      cursor: pointer; user-select: none;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px; line-height: 1.4;
      color: var(--text, #ded2d4);
      touch-action: manipulation;
      transition: background 0.12s;
    }
    .opt-mod:hover { background: rgba(255,255,255,0.06); }
    .opt-mod input[type="checkbox"] {
      width: 20px; height: 20px; margin: 0; cursor: pointer; flex: 0 0 auto;
      accent-color: var(--cta, #d1566a);
      border-radius: 6px;
    }
    .opt-mod input:disabled { cursor: not-allowed; opacity: 0.5; }
    .opt-mod input:disabled ~ span { opacity: 0.5; }

    /* Primary-row layout: full-width CTA + count label sitting below */
    .opt-primary-row { margin-top: 14px; }
    .opt-count {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: var(--faint, #8b7679);
      margin-top: 8px;
    }

    /* CTAs. Only ONE loud action per card — the primary CTA on the open
       card gets the solid accent fill. Collapsed cards get a soft tinted
       Select + borderless Customize. */
    .opt-primary {
      display: block; width: 100%;
      background: var(--cta, #d1566a);
      border: none;
      color: #fff;
      font-family: Arial, sans-serif; font-size: 16px; font-weight: 600;
      padding: 15px 18px; border-radius: 10px;
      min-height: 52px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      touch-action: manipulation;
    }
    .opt-primary:hover:not(:disabled) { background: var(--cta-hover, #e2687c); }
    .opt-primary:active { transform: translateY(1px); }
    .opt-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Collapsed-state action row: right-aligned Customize + Select pill.
       On mobile the two stack 50/50. */
    .opt-actions { display: none; }
    .option-card:not(.open) .opt-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      align-items: center; margin-top: 12px;
    }
    /* Secondary (Customize) — text button, no bg/border, muted → accent hover */
    .opt-secondary {
      background: transparent;
      border: none;
      color: var(--faint, #8b7679);
      font-family: Arial, sans-serif; font-size: 14px; font-weight: 500;
      padding: 10px 12px; min-height: 46px;
      cursor: pointer;
      transition: color 0.15s;
      touch-action: manipulation;
    }
    .opt-secondary:hover { color: var(--cta, #d1566a); }
    .opt-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Collapsed-state Select — RED accent (user pref: reader can pick
       an option without expanding, so the primary action stays loud). */
    .option-card:not(.open) .opt-actions .opt-primary {
      width: auto;
      background: var(--cta, #d1566a);
      color: #fff;
      font-size: 14px;
      padding: 12px 18px;
      min-height: 46px;
    }
    .option-card:not(.open) .opt-actions .opt-primary:hover:not(:disabled) {
      background: var(--cta-hover, #e2687c);
    }

    /* Chapters WITHOUT modifiers (V1 legacy). Card is always collapsed-
       looking but shows a single full-width Select CTA — no Customize. */
    .option-card.no-mods {
      /* Rail stays neutral (no .open state possible on these) */
    }
    .option-card.no-mods .opt-actions {
      display: block; margin-top: 14px;
    }
    .option-card.no-mods .opt-primary {
      width: 100%;
      background: var(--cta, #d1566a);
      color: #fff;
      font-size: 15px; min-height: 48px;
    }

    /* Mobile — collapsed actions stack 50/50 grid; both buttons full
       width in their cell, text centered. Primary CTA stays full-width
       when card is open. */
    @media (max-width: 480px) {
      .option-card { padding: 18px 18px 18px 26px; }
      .option-card:not(.open):not(.no-mods) .opt-actions {
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      }
      .option-card:not(.open):not(.no-mods) .opt-actions .opt-secondary,
      .option-card:not(.open):not(.no-mods) .opt-actions .opt-primary {
        width: 100%;
        text-align: center;
        padding-left: 8px; padding-right: 8px;
      }
    }

    /* Prev/all/next nav row */
    .nav-row { display: flex; justify-content: space-between; margin-top: 26px; gap: 10px; }
    .nav-btn {
      flex: 1; padding: 12px; text-align: center; text-decoration: none;
      background: rgba(255,255,255,0.05); color: var(--muted);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 12px;
      font-family: Arial, sans-serif; font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.10); color: #fff; }
    .nav-btn.primary {
      background: var(--cta); border-color: var(--cta); color: #fff;
    }
    .nav-btn.primary:hover { background: var(--cta-hover); }
    .nav-btn.disabled { opacity: 0.4; pointer-events: none; }

    /* Waiting state — chapter N+1 being generated */
    .waiting-card {
      background: rgba(240,212,140,0.06);
      border: 1px solid rgba(240,212,140,0.22);
      border-radius: 16px; padding: 24px; text-align: center; margin-top: 16px;
    }
    .waiting-card .label {
      font-family: Arial, sans-serif; font-size: 15px;
      color: var(--text, #fff); margin-bottom: 6px;
    }
    .waiting-card .sublabel {
      font-family: Arial, sans-serif; font-size: 12px; color: var(--faint);
    }
    .waiting-progress {
      width: 100%; max-width: 240px; height: 4px; margin: 16px auto 4px;
      background: rgba(255,255,255,0.10); border-radius: 4px; overflow: hidden;
    }
    .waiting-progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--cta), var(--gold));
      transition: width 0.5s linear;
    }

    .final-note {
      text-align: center; font-family: Georgia, serif; font-style: italic;
      color: var(--muted); padding: 18px; font-size: 15px; line-height: 1.5;
    }

    @media (max-width: 900px) {
      .chapter-card { padding: 20px 18px; border-radius: 14px; }
      .chapter-card h1 { font-size: 22px; }
      .prose p { font-size: 16px; line-height: 1.65; }
    }

    /* ─── Mobile "Back to top" floating button ────────────────────────
       Hidden by default. Shows when scrolled >400px past the top.
       Sits above the bottom nav in the lower-left corner. */
    .to-top-btn {
      position: fixed; z-index: 90;
      left: 16px;
      bottom: calc(70px + env(safe-area-inset-bottom, 0px));
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(224,75,87,0.9); backdrop-filter: blur(10px);
      border: none; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .to-top-btn.visible { opacity: 1; transform: translateY(0); }
    .to-top-btn:active { transform: translateY(0) scale(0.94); }
    .to-top-btn svg { width: 22px; height: 22px; }
    @media (max-width: 900px) {
      .to-top-btn { display: flex; }
    }

    /* ─── Chapter rating widget ─────────────────────────────────────
       Sits below the choose-next options / nav row. Collapsed by
       default (subtle link), expands inline into a 1-10 star strip
       plus optional feedback. Locks after first submit — the DB
       enforces one row per (chapter, user). */
    .rating-wrap {
      margin: 40px 0 8px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .rating-link {
      background: transparent; border: 0; cursor: pointer;
      font-family: Arial, sans-serif; font-size: 13px;
      color: var(--muted); letter-spacing: 0.02em;
      padding: 6px 8px;
    }
    .rating-link:hover { color: var(--gold); }
    .rating-link .star { color: var(--gold); margin-right: 4px; }

    .rating-panel {
      max-width: 460px; margin: 0 auto;
      /* Theme-aware surface — falls back to dark-mode tint when --card
         isn't set. Reading-mode light palettes define --card so this
         stays visible on cream / paper backgrounds too. */
      background: var(--card, rgba(255,255,255,0.03));
      border: 1px solid var(--rm-border, rgba(255,255,255,0.10));
      border-radius: 14px;
      padding: 18px 18px 16px;
      text-align: left;
    }
    .rating-panel .rp-q {
      font-family: Arial, sans-serif; font-size: 13px; color: var(--faint);
      letter-spacing: 0.06em; text-transform: uppercase;
      margin: 0 0 10px; font-weight: 600; text-align: center;
    }
    .rating-stars {
      display: grid; grid-template-columns: repeat(10, 1fr);
      gap: 4px; margin-bottom: 12px;
    }
    .rating-star {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--muted);
      font-family: Arial, sans-serif; font-size: 13px; font-weight: 600;
      padding: 10px 0; border-radius: 8px;
      cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .rating-star:hover, .rating-star.is-hover {
      background: rgba(240,212,140,0.14);
      border-color: rgba(240,212,140,0.35);
      color: var(--gold);
    }
    .rating-star.is-selected {
      background: rgba(240,212,140,0.28);
      border-color: var(--gold);
      color: #fff;
    }
    .rating-text {
      width: 100%;
      background: rgba(0,0,0,0.28);
      color: #f4ece1;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      font-family: Georgia, serif; font-size: 14px; line-height: 1.5;
      padding: 10px 12px; resize: vertical; min-height: 60px;
      margin-bottom: 12px;
    }
    .rating-text::placeholder { color: rgba(255,255,255,0.35); font-style: italic; }
    .rating-actions { display: flex; gap: 10px; justify-content: space-between; }
    .rating-submit {
      background: var(--cta); color: #fff; border: none;
      padding: 10px 20px; border-radius: 10px;
      font-family: Arial, sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .rating-submit:hover:not(:disabled) { background: var(--cta-hover); }
    .rating-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .rating-skip {
      background: transparent; border: 0; cursor: pointer;
      color: var(--muted); font-family: Arial, sans-serif; font-size: 13px;
      padding: 10px 12px;
    }
    .rating-skip:hover { color: #fff; }
    .rating-thanks {
      font-family: Arial, sans-serif; font-size: 13px;
      color: var(--gold); letter-spacing: 0.02em;
    }
    .rating-thanks .r-stars { font-weight: 700; }
    .rating-error {
      color: #ff9a9a; font-family: Arial, sans-serif; font-size: 12px;
      margin-top: 8px; text-align: center;
    }
  </style>

  <script type="module">
    // NOTE: `?v=` suffix pins the module URL to the current SW cache version.
    // Prevents habit-#9 SyntaxErrors when a page imports a symbol that a
    // client's cached lib.js doesn't have yet. Bump BOTH sw.js CACHE_VERSION
    // AND this ?v= in the same push when lib.js exports change.
    import { supabase, renderShell, logEvent, buildChatUrl, getSessionOrPreview, isPreviewMode, getChapterRating, saveChapterRating } from "/assets/lib.js?v=58";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const storyId = params.get("story");
    const chapterN = parseInt(params.get("n") || "1", 10);
    if (!storyId && !isPreviewMode()) { window.location.href = "/stories.html"; }

    // Preview mock: a chapter with prose + 3 options waiting to be picked
    await getSessionOrPreview({
      users: [{ display_name: "Arturas" }],
      stories: [{
        id: storyId || "m1",
        title: "Technically Off Limits",
        target_chapter_count: 10,
        current_chapter_number: chapterN,
        status: "active",
      }],
      chapters: [{
        chapter_number: chapterN,
        text: "The elevator jams between floors seven and eight.\n\nShe doesn't look up from her phone at first — just makes the small annoyed sound of a woman who has been kept from something more important than she's letting on. Then the lights flicker once. Then again. Then not at all.\n\nYou hear her breathing before you see her face turn toward yours.\n\n\"You've got to be kidding me,\" she says. Not to you. Not really. To the elevator. To the day. To the whole architectural fact of shared enclosed spaces.\n\nYou reach for the emergency panel out of some vestigial politeness. She catches your hand at the wrist before your fingers hit the button. Her grip is warmer than the room.\n\n\"Don't,\" she says. \"Please. Give me — give me one full minute of not being on that call.\"\n\nYou lower your hand. She doesn't let go of your wrist for another beat, and then she does, and then she leans back against the elevator wall and closes her eyes.\n\nSixty seconds is a long time in an elevator.\n\nIt turns out to be a very long time.",
        chosen_option: null,
        option_1: "Break the silence. Ask what the call was about.",
        option_2: "Let the silence hold. See who breaks it first.",
        option_3: "Suggest the two of you get out at the next floor and take the stairs.",
      }, { chapter_number: 4, chosen_option: 2 }],
    });
    await renderShell({ activeNav: "home" });

    $("backLink").href = "/story.html?id=" + encodeURIComponent(storyId || "m1") + (isPreviewMode() ? "&preview=1" : "");
    if (!isPreviewMode()) await logEvent("chapter_viewed", { story_id: storyId, chapter_number: chapterN });

    // Fetch story + this chapter + chapter list (for prev/next)
    const [storyR, chapterR, chapterListR] = await Promise.all([
      supabase.from("stories").select("title, target_chapter_count, current_chapter_number, status").eq("id", storyId).single(),
      supabase.from("chapters").select("*").eq("story_id", storyId).eq("chapter_number", chapterN).maybeSingle(),
      supabase.from("chapters").select("chapter_number, chosen_option").eq("story_id", storyId).order("chapter_number"),
    ]);
    const story = storyR.data;
    const chapter = chapterR.data;
    const all = chapterListR.data || [];

    if (story) $("storyTitle").textContent = story.title || "";

    // ── Reading-position memory (localStorage) ────────────────────
    // Save scroll Y debounced; restore on open. Skip restore when arriving fresh
    // from a "Read Chapter N+1" hand-off (user always wants to start at top).
    const POS_KEY = `pos:${storyId}:${chapterN}`;
    const POS_INDEX_KEY = "pos:_recent";
    const POS_MAX = 40;
    const camefrom_fresh = new URLSearchParams(location.search).get("fresh") === "1";

    function rememberPos(key) {
      try {
        const idx = JSON.parse(localStorage.getItem(POS_INDEX_KEY) || "[]").filter(k => k !== key);
        idx.unshift(key);
        while (idx.length > POS_MAX) {
          const dead = idx.pop();
          localStorage.removeItem(dead);
        }
        localStorage.setItem(POS_INDEX_KEY, JSON.stringify(idx));
      } catch (_) {}
    }
    if (!camefrom_fresh) {
      window.requestAnimationFrame(() => {
        try {
          const saved = parseInt(localStorage.getItem(POS_KEY) || "0", 10);
          if (saved > 100) window.scrollTo({ top: saved, behavior: "auto" });
        } catch (_) {}
      });
    }
    let posSaveTimer = null;
    const toTopBtn = $("toTopBtn");
    window.addEventListener("scroll", () => {
      clearTimeout(posSaveTimer);
      posSaveTimer = setTimeout(() => {
        try {
          const y = window.scrollY;
          if (y > 100) { localStorage.setItem(POS_KEY, String(y)); rememberPos(POS_KEY); }
          else { localStorage.removeItem(POS_KEY); }
        } catch (_) {}
      }, 600);
      // Toggle the "Back to top" button — visible after scrolling past 400px
      if (toTopBtn) {
        if (window.scrollY > 400) toTopBtn.classList.add("visible");
        else toTopBtn.classList.remove("visible");
      }
    }, { passive: true });
    // Smooth scroll to the very top (past the mobile header) on click
    toTopBtn?.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // ── Render chapter ────────────────────────────────────────────
    if (!chapter || !chapter.text) {
      $("chapterLabel").textContent = "This chapter hasn't been written yet.";
      $("navArea").innerHTML = `<a class="nav-btn" href="/story.html?id=${encodeURIComponent(storyId)}">← Back to chapter list</a>`;
    } else {
      const total = story?.target_chapter_count || 10;
      $("chapterLabel").textContent = `Chapter ${chapterN} of ${total}`;
      $("chapterTitle").textContent = story?.title || "";
      $("prose").innerHTML = renderProse(chapter.text);
      $("chapterCard").style.display = "block";

      const isFinal = chapterN >= total;
      const alreadyChose = chapter.chosen_option != null;
      const nextExists = all.some(c => c.chapter_number === chapterN + 1);

      if (isFinal) {
        $("optionsArea").innerHTML = `
          <div class="final-note">
            You've reached the end of your story. <strong>One last thing</strong> — your finished book has just unlocked something new: a private conversation with any of its characters.
          </div>
          <div style="margin-top:16px;text-align:center;">
            <a class="nav-btn primary" id="chatUnlockBtn"
               style="display:inline-block;padding:14px 26px;font-size:15px;text-decoration:none;cursor:pointer;" href="#">
              Chat with the characters →
            </a>
          </div>
        `;
        $("chatUnlockBtn")?.addEventListener("click", async (e) => {
          e.preventDefault();
          const url = await buildChatUrl(storyId);
          window.open(url, "_blank", "noopener");
        });
      } else if (alreadyChose && nextExists) {
        renderNavButtons(chapterN, total, all);
      } else if (alreadyChose && !nextExists) {
        renderWaitingState();
      } else {
        renderOptionButtons(chapter);
      }

      // Rating widget (below choices / nav / final block).
      // Skip in preview mode — no real user, no real chapter id.
      if (!isPreviewMode() && chapter?.id) {
        renderRatingWidget(chapter);
      }
    }

    // ── Chapter rating widget ─────────────────────────────────────
    // Collapsed "★ Rate this chapter" link → expanded 1-10 star strip
    // + optional textarea + Submit. One-shot per (user, chapter) enforced
    // by the DB. Once submitted, widget shows permanent "Thanks — 8/10".
    async function renderRatingWidget(chap) {
      const area = $("ratingArea");
      if (!area) return;
      area.innerHTML = "";                                   // reset

      // Ask the DB whether this user has already rated this chapter.
      // If yes → show locked "thanks" state. If no → show collapsed link.
      const { rating } = await getChapterRating(chap.id);
      if (rating) { renderRatingThanks(rating.stars); return; }

      const wrap = document.createElement("div");
      wrap.className = "rating-wrap";
      wrap.innerHTML = `<button type="button" class="rating-link" id="ratingOpen">
        <span class="star">★</span>Rate this chapter</button>`;
      area.appendChild(wrap);
      $("ratingOpen").addEventListener("click", () => renderRatingPanel(chap));
    }

    function renderRatingPanel(chap) {
      const area = $("ratingArea");
      area.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "rating-wrap";
      // Scroll the whole panel into view once it renders (next frame so the
      // element has a size). Center it so the stars + textarea + buttons
      // are all visible without further scrolling.
      requestAnimationFrame(() => {
        wrap.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      wrap.innerHTML = `
        <div class="rating-panel">
          <p class="rp-q">How was this chapter?</p>
          <div class="rating-stars" id="ratingStars">
            ${Array.from({length: 10}, (_, i) => `
              <button type="button" class="rating-star" data-v="${i + 1}" aria-label="${i + 1} out of 10">${i + 1}</button>
            `).join("")}
          </div>
          <textarea class="rating-text" id="ratingText" rows="2"
            placeholder="Optional: what worked, what didn't?"></textarea>
          <div class="rating-actions">
            <button type="button" class="rating-submit" id="ratingSubmit" disabled>Submit</button>
            <button type="button" class="rating-skip" id="ratingSkip">Skip</button>
          </div>
          <div class="rating-error" id="ratingErr" style="display:none"></div>
        </div>`;
      area.appendChild(wrap);

      let selected = 0;
      const stars = area.querySelectorAll(".rating-star");
      const submitBtn = $("ratingSubmit");

      // Hover preview on desktop only (touch devices skip — no hover state)
      const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      stars.forEach(btn => {
        const v = parseInt(btn.dataset.v, 10);
        if (!isTouch) {
          btn.addEventListener("mouseenter", () => {
            stars.forEach(s => s.classList.toggle("is-hover",
              parseInt(s.dataset.v, 10) <= v && !s.classList.contains("is-selected")));
          });
          btn.addEventListener("mouseleave", () => {
            stars.forEach(s => s.classList.remove("is-hover"));
          });
        }
        btn.addEventListener("click", () => {
          selected = v;
          stars.forEach(s => s.classList.toggle("is-selected",
            parseInt(s.dataset.v, 10) <= v));
          submitBtn.disabled = false;
        });
      });

      $("ratingSkip").addEventListener("click", () => renderRatingWidget(chap));

      submitBtn.addEventListener("click", async () => {
        if (!selected) return;
        submitBtn.disabled = true;
        submitBtn.textContent = "Saving…";
        $("ratingErr").style.display = "none";
        const text = $("ratingText").value;
        const { ok, alreadyRated, error } = await saveChapterRating(chap.id, {
          story_id: storyId,
          chapter_number: chapterN,
          stars: selected,
          feedback_text: text,
        });
        if (ok || alreadyRated) {
          logEvent("chapter_rated", {
            story_id: storyId, chapter_number: chapterN,
            metadata: { stars: selected, has_text: !!text.trim() },
          }).catch(() => {});
          renderRatingThanks(selected);
        } else {
          $("ratingErr").textContent = error || "Couldn't save. Try again in a moment.";
          $("ratingErr").style.display = "block";
          submitBtn.disabled = false; submitBtn.textContent = "Submit";
        }
      });
    }

    function renderRatingThanks(stars) {
      const area = $("ratingArea");
      area.innerHTML = `<div class="rating-wrap">
        <div class="rating-thanks">Thanks — you rated this chapter <span class="r-stars">${stars}/10</span>.</div>
      </div>`;
    }

    function renderProse(text) {
      return text.split(/\n{2,}/).map(p =>
        `<p>${escapeHtml(p.trim()).replace(/\n/g, "<br>")}</p>`
      ).join("");
    }

    function renderOptionButtons(chapter) {
      const opts = [chapter.option_1, chapter.option_2, chapter.option_3].filter(Boolean);
      // Per-option modifier chips (IDEA #3, "Optional additions"). Comes as
      // {"1":[...],"2":[...],"3":[...]} on chapter.next_options_modifiers.
      // Legacy chapters (V1 or pre-Aug-6) have this null → cards render
      // as .no-mods (single full-width Select, no Customize).
      //
      // UI model (v4 — spec: expandable-option-blocks):
      // • Exactly ONE card is open at a time.
      // • Default open = the FIRST card that has modifiers. If no card has
      //   modifiers (all V1-legacy), none is open — all render .no-mods.
      // • Open card: additions checklist + full-width solid CTA + count line.
      // • Closed card: right-aligned [Customize] [Select this option N →].
      // • Clicking Customize on a closed card opens it, closing whichever
      //   was previously open.
      const mods = (chapter && chapter.next_options_modifiers) || {};

      // Precompute per-option state so we can pick default open card
      const optMeta = opts.map((opt, i) => {
        const idx = i + 1;
        const optMods = Array.isArray(mods[String(idx)]) ? mods[String(idx)] : [];
        return { idx, opt, optMods, hasMods: optMods.length > 0 };
      });
      const defaultOpen = null;  // spec: cards start collapsed, user opens via Customize

      function countLabel(n) {
        if (n === 0) return "No additions";
        if (n === 1) return "1 addition";
        return `${n} additions`;
      }

      $("optionsArea").innerHTML = `
        <p class="choose-label">Choose what happens next:</p>
        ${optMeta.map(({ idx, opt, optMods, hasMods }) => {
          const isOpen = idx === defaultOpen;
          const noMods = !hasMods;
          const cardClasses = [
            "option-card",
            isOpen ? "open" : "",
            noMods ? "no-mods" : "",
          ].filter(Boolean).join(" ");

          const additionsHtml = hasMods ? `
            <div class="opt-additions">
              <div class="opt-mods-label">Optional additions</div>
              ${optMods.map((m) => `
                <label class="opt-mod">
                  <input type="checkbox" data-mod="${escapeHtml(m)}" data-i="${idx}">
                  <span>${escapeHtml(m)}</span>
                </label>`).join("")}
              <div class="opt-primary-row">
                <button type="button" class="opt-primary" data-select="${idx}">Select this option ${idx} →</button>
                <div class="opt-count" data-count="${idx}">No additions</div>
              </div>
            </div>
          ` : "";

          // Collapsed / no-mods actions row
          const actionsHtml = noMods
            ? `<div class="opt-actions">
                 <button type="button" class="opt-primary" data-select="${idx}">Select this option ${idx} →</button>
               </div>`
            : `<div class="opt-actions">
                 <button type="button" class="opt-secondary" data-open="${idx}"><span data-customize-label="${idx}">Customize</span></button>
                 <button type="button" class="opt-primary" data-select="${idx}">Select this option ${idx} →</button>
               </div>`;

          return `
            <div class="${cardClasses}" data-card="${idx}">
              <div class="opt-header">
                <span class="opt-index">${String(idx).padStart(2, "0")}</span>
                <p class="opt-text" data-text="${idx}">${escapeHtml(opt)}</p>
              </div>
              ${additionsHtml}
              ${actionsHtml}
            </div>
          `;
        }).join("")}
      `;

      // Update the count line on the OPEN card whenever a checkbox is toggled
      function updateCount(idx) {
        const additions = $("optionsArea").querySelector(`.option-card[data-card="${idx}"] .opt-additions`);
        if (!additions) return;
        const n = additions.querySelectorAll('input[type="checkbox"]:checked').length;
        // Open-card count line (below the primary CTA)
        const countEl = $("optionsArea").querySelector(`.opt-count[data-count="${idx}"]`);
        if (countEl) countEl.textContent = countLabel(n);
        // Collapsed-card Customize button label — surface count so the
        // reader knows their picks are still active before hitting Select.
        const customizeLabel = $("optionsArea").querySelector(`[data-customize-label="${idx}"]`);
        if (customizeLabel) {
          customizeLabel.textContent = n > 0 ? `Customize (${n} selected)` : "Customize";
        }
      }

      // Exclusive open logic: clicking Customize on a closed card opens it
      // and closes any previously open card. Checkboxes are preserved (state
      // lives in the DOM inside .opt-additions, which just gets hidden).
      $("optionsArea").querySelectorAll("[data-open]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = btn.dataset.open;
          const cards = $("optionsArea").querySelectorAll(".option-card");
          cards.forEach(c => c.classList.remove("open"));
          const target = $("optionsArea").querySelector(`.option-card[data-card="${idx}"]`);
          if (target) target.classList.add("open");
          updateCount(idx);
        });
      });

      // Click the prose text on an OPEN card to collapse it back. Doesn't
      // clear checkboxes — user may re-open via Customize and see them still
      // ticked. (Skipped on .no-mods cards since they have no open state.)
      $("optionsArea").querySelectorAll("[data-text]").forEach(textEl => {
        textEl.addEventListener("click", () => {
          const idx = textEl.dataset.text;
          const card = $("optionsArea").querySelector(`.option-card[data-card="${idx}"]`);
          if (!card || !card.classList.contains("open") || card.classList.contains("no-mods")) return;
          card.classList.remove("open");
        });
      });

      // Live count on the open card as boxes are toggled
      $("optionsArea").querySelectorAll(".opt-mod input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", (e) => {
          e.stopPropagation();
          updateCount(cb.dataset.i);
        });
      });
      // Prevent label-row clicks from bubbling up to the card open handler
      $("optionsArea").querySelectorAll(".opt-mod").forEach(row => {
        row.addEventListener("click", (e) => e.stopPropagation());
      });

      // Select handlers — collect any checked modifiers under THIS option's
      // additions block (empty array if the option has no modifiers or none
      // are checked). All Select buttons fire the same submitChoice path.
      $("optionsArea").querySelectorAll("[data-select]").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.select, 10);
          const checked = [...$("optionsArea").querySelectorAll(
            `.option-card[data-card="${idx}"] .opt-additions input[type="checkbox"]:checked`
          )].map(cb => cb.dataset.mod);
          await submitChoice(idx, checked);
        });
      });

      renderNavButtons(chapterN, story?.target_chapter_count || 10, all);
    }

    async function submitChoice(optionIndex, modifiers) {
      $("optionsArea").querySelectorAll(".option-btn, .opt-primary, .opt-secondary").forEach(b => b.disabled = true);
      $("optionsArea").querySelectorAll(".opt-mod input").forEach(cb => cb.disabled = true);
      const SUPABASE_URL = "https://gmhbcxylqubhxozomhlt.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtaGJjeHlscXViaHhvem9taGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTk5OTksImV4cCI6MjA5MjczNTk5OX0.GAM73P5X7fT1BIziTfvqUpFT2W_W5EtFb5Gze5cIFfY";
      try {
        const body = { story_id: storyId, chapter_number: chapterN, option: optionIndex };
        if (Array.isArray(modifiers) && modifiers.length > 0) body.modifiers = modifiers;
        const res = await fetch(`${SUPABASE_URL}/functions/v1/submit-choice`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify(body),
        });
        const result = await res.json();
        await logEvent("option_clicked", {
          story_id: storyId, chapter_number: chapterN,
          metadata: {
            option: optionIndex, status: result.status,
            modifiers_count: (modifiers && modifiers.length) || 0,
            modifiers: modifiers || [],
          },
        });
        if (result.status === "ok" || result.status === "success" || result.status === "duplicate") {
          renderWaitingState();
        } else {
          throw new Error(result.message || "Something went wrong.");
        }
      } catch (e) {
        console.error("submit-choice failed:", e);
        $("optionsArea").innerHTML =
          `<div class="waiting-card"><div class="label">Couldn't submit your choice — ${escapeHtml(e.message)}</div>
           <div class="sublabel">Refresh and try again.</div></div>`;
      }
    }

    // Waiting state: realtime listener + 180s progress bar + email-fallback message.
    function renderWaitingState() {
      $("optionsArea").innerHTML = `
        <div class="waiting-card">
          <div class="label">Writing your next chapter…</div>
          <div class="sublabel">Usually 60-90 seconds. Sometimes up to 3 minutes.</div>
          <div class="waiting-progress"><div class="waiting-progress-fill" id="waitProg"></div></div>
        </div>
      `;
      $("navArea").innerHTML = `<div class="nav-row" style="margin-top:20px;">
        <a class="nav-btn" href="/story.html?id=${encodeURIComponent(storyId)}">← Back to chapter list</a></div>`;

      let start = Date.now();
      const cap = 180000;
      const progEl = $("waitProg");
      const tick = setInterval(() => {
        const pct = Math.min(100, ((Date.now() - start) / cap) * 100);
        if (progEl) progEl.style.width = pct + "%";
        if (pct >= 100) { clearInterval(tick); onTimeout(); }
      }, 500);

      const channel = supabase
        .channel(`chapter-next-${storyId}-${chapterN + 1}`)
        .on("postgres_changes", {
          event: "INSERT", schema: "public", table: "chapters",
          filter: `story_id=eq.${storyId}`,
        }, async (payload) => {
          if (payload.new?.chapter_number === chapterN + 1) {
            clearInterval(tick);
            await logEvent("chapter_ready_in_app", { story_id: storyId, chapter_number: chapterN + 1 });
            supabase.removeChannel(channel);
            $("optionsArea").innerHTML = `
              <div class="waiting-card" style="background: rgba(95,210,143,0.08); border-color: rgba(95,210,143,0.3);">
                <div class="label" style="color:#b6f0c8">Your next chapter is ready!</div>
                <a class="nav-btn primary" style="display:inline-block;margin-top:14px" href="/chapter.html?story=${encodeURIComponent(storyId)}&n=${chapterN + 1}&fresh=1">
                  Read Chapter ${chapterN + 1} →
                </a>
              </div>`;
          }
        })
        .subscribe();

      function onTimeout() {
        supabase.removeChannel(channel);
        $("optionsArea").innerHTML = `
          <div class="waiting-card">
            <div class="label">Still writing — the story engine's taking its time.</div>
            <div class="sublabel">You can safely close this page. We'll email you within the next 10-15 minutes once your chapter is ready, and it'll also appear here.</div>
            <button class="nav-btn primary" style="margin-top:14px" id="checkNowBtn">Check now</button>
          </div>`;
        $("checkNowBtn").addEventListener("click", async () => {
          const { data: c } = await supabase.from("chapters")
            .select("chapter_number").eq("story_id", storyId)
            .eq("chapter_number", chapterN + 1).maybeSingle();
          if (c) {
            window.location.href = `/chapter.html?story=${encodeURIComponent(storyId)}&n=${chapterN + 1}&fresh=1`;
          } else {
            $("checkNowBtn").textContent = "Not ready yet — try again in a minute";
          }
        });
      }
    }

    function renderNavButtons(n, total, allChapters) {
      const hasPrev = n > 1;
      const hasNext = allChapters.some(c => c.chapter_number === n + 1);
      $("navArea").innerHTML = `
        <div class="nav-row">
          ${hasPrev ? `<a class="nav-btn" href="/chapter.html?story=${encodeURIComponent(storyId)}&n=${n - 1}">← Chapter ${n - 1}</a>` : ''}
          <a class="nav-btn" href="/story.html?id=${encodeURIComponent(storyId)}">All chapters</a>
          ${hasNext ? `<a class="nav-btn primary" href="/chapter.html?story=${encodeURIComponent(storyId)}&n=${n + 1}">Chapter ${n + 1} →</a>` : ''}
        </div>`;
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
  </script>
</body>
